# Publica o site (www/) no GitHub Pages a cada atualização.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Leitor de código de barras do app (ZXing, cópia local)
        continue-on-error: true
        run: mkdir -p www/vendor && curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js -o www/vendor/zxing.min.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
