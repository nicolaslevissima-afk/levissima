# Gera o app Android. Sem a chave de assinatura: APK de teste (instala direto no celular).
# Com a chave (segredos ANDROID_*): AAB assinado para a Google Play (e envio automático, se houver PLAY_SERVICE_ACCOUNT_JSON).
name: App Android

on:
  push:
    branches: [main]
    paths: ['www/**', 'assets/**', 'capacitor.config.json', 'package.json', 'scripts/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # para publicar o APK em "Releases" (link fixo para baixar no celular)
    env:
      TEM_CHAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      TEM_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar o Capacitor
        run: npm install --no-audit --no-fund
      - name: Criar o projeto Android
        run: npx cap add android
      - name: Ícones e tela de abertura
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF' --splashBackgroundColor '#FFFFFF' --splashBackgroundColorDark '#FFFFFF'
      - name: Permissões e número da versão
        run: python3 scripts/ajustar_android.py
      - name: Copiar o app para o projeto
        run: npx cap sync android
      - name: Gerar o aplicativo
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$TEM_CHAVE" = "true" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            ./gradlew --no-daemon bundleRelease assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          else
            ./gradlew --no-daemon assembleDebug
          fi
      - name: Guardar o app gerado
        uses: actions/upload-artifact@v4
        with:
          name: levissima-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publicar o APK para baixar no celular
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO="1.0.${{ github.run_number }}"
          APK=$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | grep -v unsigned | head -1 || true)
          if [ -n "$APK" ]; then
            TIPO="assinado com a chave da Levíssima"
          else
            APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
            TIPO="de teste (ainda sem a chave de assinatura da Google Play)"
          fi
          cp "$APK" "$RUNNER_TEMP/levissima.apk"
          printf 'Aplicativo LEVÍSSIMA para Android, versão %s, %s.\n\nPara instalar: abra este link no celular, baixe o arquivo levissima.apk e toque nele. Se o Android pedir, permita instalar apps desta fonte.\n' "$VERSAO" "$TIPO" > "$RUNNER_TEMP/notas.md"
          gh release create "v$VERSAO" "$RUNNER_TEMP/levissima.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "LEVÍSSIMA $VERSAO" --notes-file "$RUNNER_TEMP/notas.md" --latest
      - name: Enviar para a Google Play (teste interno, rascunho)
        if: env.TEM_CHAVE == 'true' && env.TEM_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.levissima.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
