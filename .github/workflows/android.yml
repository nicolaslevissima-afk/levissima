# Gera o app Android. Sem a chave de assinatura: APK de teste (instala direto no celular).
# Com a chave (segredos ANDROID_*): AAB assinado para a Google Play (e envio automático, se houver PLAY_SERVICE_ACCOUNT_JSON).
name: App Android

on:
  push:
    branches: [main]
    paths: ['www/**', 'assets/**', 'capacitor.config.json', 'package.json', 'scripts/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      TEM_CHAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      TEM_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar o Capacitor
        run: npm install --no-audit --no-fund
      - name: Criar o projeto Android
        run: npx cap add android
      - name: Ícones e tela de abertura
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#166C60' --iconBackgroundColorDark '#166C60' --splashBackgroundColor '#F1F4EE' --splashBackgroundColorDark '#121815'
      - name: Permissões e número da versão
        run: python3 scripts/ajustar_android.py
      - name: Copiar o app para o projeto
        run: npx cap sync android
      - name: Gerar o aplicativo
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$TEM_CHAVE" = "true" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            ./gradlew --no-daemon bundleRelease assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          else
            ./gradlew --no-daemon assembleDebug
          fi
      - name: Guardar o app gerado
        uses: actions/upload-artifact@v4
        with:
          name: levissima-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Enviar para a Google Play (teste interno, rascunho)
        if: env.TEM_CHAVE == 'true' && env.TEM_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.levissima.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
