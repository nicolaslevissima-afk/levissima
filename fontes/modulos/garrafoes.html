<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estoque de garrafões · LEVÍSSIMA</title>
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="ponte.js" data-modulo="garrafoes"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Estoque de garrafões (refeito em 17/11/2026; 19/11/2026: lote = fabricação, sucata só por litragem,
   assinatura do cliente na tela e foto da nota pela câmera). Mesmas cores e letras do módulo anterior. */
:root{
  --bg:#EDF3F6; --surface:#FFFFFF; --ink:#0D2B3E; --muted:#587080; --line:#D2DFE6;
  --water:#2A86B5; --water-soft:#CFE6F1; --water-deep:#0F5E8A;
  --amber:#B87412; --amber-soft:#FBEBCF; --red:#B8352C; --red-soft:#F8DAD7; --green:#23794D; --green-soft:#D6EFE1;
  --jug:#DCEBF2; --jug-line:#9DBFCF;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 56px}
h1,h2,h3,.num{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
h2{margin:0;font-size:1.45rem;font-weight:600}
h3{margin:0;font-size:1.15rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
[hidden]{display:none!important}

.produtos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.prod{border:0;background:none;border-radius:10px;padding:8px 6px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center;line-height:1.2}
.prod .num{font-size:1.25rem}
.prod small{font-weight:500;font-size:.85rem;opacity:.85}
.prod[aria-pressed="true"]{background:var(--water-deep);color:#fff}
.prod[aria-disabled="true"]:not([aria-pressed="true"]){opacity:.5;cursor:not-allowed}

.quem{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:.92rem;color:var(--muted);margin:0 2px 12px}
.quem b{color:var(--ink);font-weight:600}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--water-soft);color:var(--water-deep);font-weight:600;font-size:.82rem}

.bloco{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.bloco-topo{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.rotulo{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.gauge{width:112px}
.gauge svg{display:block;width:100%;height:auto}
.gauge.p10 svg{width:80%;margin:0 auto}
.fill{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
.big{font-size:clamp(3.2rem,12vw,5.2rem);line-height:.9;font-weight:700;margin:2px 0 6px}
.big small{font-size:.32em;font-weight:600;color:var(--muted);margin-left:6px}
.status{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:600;font-size:.92rem}
.status.ok{background:var(--green-soft);color:var(--green)}
.status.baixo{background:var(--amber-soft);color:var(--amber)}
.status.zero{background:var(--red-soft);color:var(--red)}
.marcas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.marca{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:0}
.marca:hover{border-color:var(--water)}
.marca .nome{font-weight:600;color:var(--muted);font-size:.9rem}
.marca .num{font-size:2rem;font-weight:700;line-height:1.05}
.marca .det{font-size:.82rem;color:var(--muted)}
.marca.suc{cursor:default}
.marca.suc:hover{border-color:var(--line)}
.avisos{margin:10px 0 0;padding:0;list-style:none;font-size:.92rem}
.avisos li{margin-top:3px;color:var(--amber)}
.avisos li.grave{color:var(--red)}
.periodo{font-size:.9rem;color:var(--muted);margin-top:8px}

.acoes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:4px 0 12px}
.acoes.n1{grid-template-columns:1fr} .acoes.n2{grid-template-columns:repeat(2,1fr)} .acoes.n3{grid-template-columns:repeat(3,1fr)}
.acao{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:68px}
.acao b{font-weight:600;font-size:1rem;line-height:1.2}
.acao span{font-size:.82rem;color:var(--muted);line-height:1.25}
.acao:hover{border-color:var(--water)}
.acao[aria-pressed="true"]{border-color:var(--water);box-shadow:inset 0 0 0 1px var(--water);background:var(--water-soft)}
.acao.novo b{color:var(--water-deep)}
.so-consulta{font-size:.92rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin:0 0 12px}

.painel-form{background:var(--surface);border:1.5px solid var(--water);border-radius:16px;padding:18px;margin-bottom:14px}
.painel-form h2{margin-bottom:2px}
.painel-form .sub{color:var(--muted);font-size:.92rem;margin:0 0 12px}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 14px}
label,.campo{display:flex;flex-direction:column;gap:4px;font-size:.9rem;font-weight:500}
.dica{font-weight:400;color:var(--muted);font-size:.8rem}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;min-width:0;width:100%;font-size:16px}
input[readonly]{background:var(--surface);color:var(--muted)}
textarea{min-height:44px;resize:vertical}
.largo{grid-column:1/-1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:96px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--water-deep);border-color:var(--water-deep);color:#fff}
.grupo{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.grupo-topo{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.linha{display:grid;grid-template-columns:1.1fr 1.6fr .8fr auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg)}
.linha.ret{grid-template-columns:1.2fr 1fr auto}
.linha.nov{grid-template-columns:1fr 1.8fr .8fr auto}
.linha .desc{grid-column:1/-1}
.linha input,.linha select{background:var(--surface)}
.x{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:44px;height:44px;cursor:pointer;font-size:1.2rem;color:var(--muted)}
.mais-linha{border:1px dashed var(--water);background:none;color:var(--water-deep);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.soma{font-size:.95rem;font-weight:600}
.soma.erro{color:var(--red)} .soma.ok{color:var(--green)}
.sugestao{font-size:.92rem;background:var(--water-soft);color:var(--water-deep);border-radius:10px;padding:8px 12px;margin:6px 0 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.sugestao button{border:0;background:var(--water-deep);color:#fff;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer}
.info-lote{font-size:.88rem;color:var(--muted);margin-top:2px}
.info-lote.novo{color:var(--water-deep)}
.tlotes{width:100%;border-collapse:collapse;font-size:.95rem}
.tlotes th,.tlotes td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tlotes th{font-size:.8rem;color:var(--muted);font-weight:600}
.tlotes td.q,.tlotes th.q{text-align:right;white-space:nowrap}
.tlotes input{width:96px;text-align:right;padding:8px}
.tlotes tr.sug td{background:var(--water-soft)}
.box-rol{overflow-x:auto;margin:0 -4px;padding:0 4px}
.linha-botoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--water-deep);color:#fff;min-height:44px}
.btn[disabled]{opacity:.55;cursor:wait}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.perigo{background:var(--red)}
.msg{font-size:.92rem}
.msg.erro{color:var(--red)} .msg.ok{color:var(--green)}
.erro-caixa{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px;font-weight:500;margin:0 0 12px}
.resumo{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0 0}
.resumo p{margin:4px 0}
.resumo b{font-weight:600}
.dif-mais{color:var(--water-deep);font-weight:600} .dif-menos{color:var(--red);font-weight:600} .dif-zero{color:var(--muted)}

.abas{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 12px;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.aba[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--water)}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.resumo-periodo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.resumo-periodo div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.resumo-periodo dt{font-size:.82rem;color:var(--muted)}
.resumo-periodo dd{margin:0;font-family:"Barlow Condensed",system-ui,sans-serif;font-size:1.5rem;font-weight:600;line-height:1.1}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hi{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.hi:last-child{border-bottom:0}
.hi:hover{background:var(--bg)}
.hi .t{font-weight:600}
.hi .d{grid-column:1/2;font-size:.88rem;color:var(--muted)}
.hi .q{grid-row:1/3;grid-column:2;align-self:center;font-family:"Barlow Condensed",system-ui,sans-serif;font-size:1.45rem;font-weight:600;white-space:nowrap}
.mais{color:var(--water-deep)} .menos{color:var(--red)} .zero{color:var(--muted)}
.vazio{padding:26px 16px;text-align:center;color:var(--muted)}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.perto{background:var(--amber-soft);color:var(--amber)}
.tag.vencido{background:var(--red-soft);color:var(--red)}
.tag.az{background:var(--water-soft);color:var(--water-deep)}
.nota{font-size:.9rem;color:var(--muted);margin:10px 2px}
.cfg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.cfg + .cfg{margin-top:12px}
.cfg h2{margin-bottom:8px}
.perfil-l{display:grid;grid-template-columns:1fr minmax(170px,240px);gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.perfil-l:last-child{border-bottom:0}
.perfil-l .n{font-weight:600}
.perfil-l .s{font-size:.85rem;color:var(--muted)}
.ver-mais{display:block;margin:10px auto 0}

.modal{position:fixed;inset:0;background:rgba(13,43,62,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal-c{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{align-items:center;padding:24px}.modal-c{border-radius:18px}}
.modal-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0 12px;font-size:.95rem}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.link{background:none;border:0;padding:0;color:var(--water-deep);font-weight:600;text-decoration:underline;cursor:pointer;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;z-index:100;max-width:92vw;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.carregando{padding:40px 16px;text-align:center;color:var(--muted)}

@media (max-width:760px){
  .acoes,.acoes.n3{grid-template-columns:repeat(2,1fr)}
  .acoes.n5 .acao:last-child,.acoes.n3 .acao:last-child{grid-column:1/-1}
}
@media (max-width:640px){
  .bloco{padding:16px}
  .hero{grid-template-columns:1fr;gap:6px;position:relative}
  .gauge{width:74px;position:absolute;right:0;top:0}
  .linha,.linha.nov{grid-template-columns:1fr 1fr}
  .linha .mot,.linha .lotesel{grid-column:1/-1}
  .linha .x{justify-self:end}
  .linha.ret{grid-template-columns:1fr 1fr auto}
  .perfil-l{grid-template-columns:1fr}
}

/* 19/11/2026: cartões Novos AGS | Novos Montico | Sucatas, assinatura na tela e foto da nota pela câmera */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.cards3.n2{grid-template-columns:1fr 1fr}
.marca.suc{border-color:#E8D3AE;background:#FFF8EC;cursor:pointer}
.marca.suc:hover{border-color:var(--amber)}
.marca.suc .num{color:#7A4C0B}
.campo-foto{display:flex;flex-direction:column;gap:6px}
.btn-foto{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--water);background:var(--water-soft);color:var(--water-deep);border-radius:12px;padding:16px;font-weight:600;cursor:pointer;min-height:64px}
.foto-prev{max-width:min(100%,360px);border-radius:10px;border:1px solid var(--line);display:block}
.cam-video{width:100%;max-height:62vh;background:#000;border-radius:12px;display:block;object-fit:contain}
.assin-topo{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:14px}
.assin{display:block;width:100%;height:190px;border:1.5px dashed var(--muted);border-radius:12px;background:#fff;touch-action:none;cursor:crosshair}
.assin.ok{border-style:solid;border-color:var(--green)}
.aviso-ass{font-size:.8rem;color:var(--muted);margin:4px 0 0}
.aviso-troca{background:var(--amber-soft);color:#7A4C0B;border-radius:10px;padding:8px 12px;font-weight:500;margin:10px 0 0}
.img-doc{display:block;max-width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0}
.img-doc.foto{max-height:240px;cursor:zoom-in}
.img-doc.foto.grande{max-height:none;cursor:zoom-out}
.anexo{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
@media (max-width:440px){
  .cards3{gap:6px}
  .cards3 .marca{padding:8px 9px}
  .cards3 .marca .num{font-size:1.55rem}
  .cards3 .marca .nome{font-size:.78rem;line-height:1.2}
  .cards3 .marca .det{font-size:.72rem}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="produtos" class="produtos" role="group" aria-label="Modelo"></div>
  <div id="quem" class="quem"></div>
  <div id="principal"><p class="carregando">Carregando o estoque…</p></div>
</div>
<div id="modal" class="modal" hidden><div class="modal-c" id="modal-c" role="dialog" aria-modal="true" aria-labelledby="modal-t"></div></div>
<div id="cam" class="modal" hidden><div class="modal-c" id="cam-c" role="dialog" aria-modal="true" aria-labelledby="cam-t"></div></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  /* ===================== constantes ===================== */
  // 19/11/2026: lote dos novos = fabricação (mês/ano); sucata só por litragem (20 L e 10 L); 20 L com rosca sem troca.
  var MODELOS = {
    '20L': { nome: '20 L', longo: '20 litros', curto: '20 L' },
    '20LR': { nome: '20 L com rosca', longo: '20 litros com rosca', curto: '20 L com rosca' },
    '10L': { nome: '10 L', longo: '10 litros', curto: '10 L' }
  };
  var ORDEM = ['20L', '20LR', '10L'];
  var MARCAS_DE = { '20L': ['AGS', 'Montico'], '20LR': ['Montico', 'Angioplast'], '10L': ['AGS', 'Montico'] };
  var MOTIVOS = ['Quebrado ou trincado', 'Vencido', 'Vazamento', 'Contaminado ou sujo', 'Outro'];
  var RECOLHE = ['AGS', 'Montico', 'Outro'];
  var PERFIS = { consulta: 'Só consulta', entradas: 'Contagem e entradas', entregas: 'Entregas', gestao: 'Gestão' };
  var TIPOS = { entrada: 'Entrada de novos', saida: 'Saída / Venda', troca: 'Troca com cliente', retirada: 'Retirada de sucata', contagem: 'Contagem física' };
  var PROPORCAO = 5; // sugestão: 5 sucatas para 1 novo
  var PADRAO = { validadeAnos: 3, produtos: { '20L': { minimo: 20, ideal: 100 }, '20LR': { minimo: 20, ideal: 100 }, '10L': { minimo: 20, ideal: 100 } } };
  var PASSO_HIST = 150;
  var AVISO_ASSIN = 'Assinatura manuscrita feita na tela do aparelho (não é assinatura com certificado digital).';

  function marcas(m) { return MARCAS_DE[m] || []; }
  function temSucata(m) { return m !== '20LR'; }

  /* ===================== utilidades ===================== */
  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function hoje() { var d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function mesAtual() { return hoje().slice(0, 7); }
  function dataBR(s) { s = String(s || ''); return s.length >= 10 ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : ''; }
  function mesBR(s) { s = String(s || ''); return s.length >= 7 ? s.slice(5, 7) + '/' + s.slice(0, 4) : ''; }
  function dataHoraBR(iso) { var d = new Date(iso); if (!iso || isNaN(d.getTime())) return ''; return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
  function fmt(n) { return Number(n || 0).toLocaleString('pt-BR'); }
  function sinal(n) { return n > 0 ? '+' + fmt(n) : n < 0 ? '−' + fmt(-n) : '0'; }
  function un(n) { return fmt(n) + (Math.abs(n) === 1 ? ' unidade' : ' unidades'); }
  function inteiro(v) { var s = String(v == null ? '' : v).trim(); if (!/^\d{1,7}$/.test(s)) return null; return parseInt(s, 10); }
  function nomeMes(ym) { var m = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro']; return m[Number(ym.slice(5, 7)) - 1] || ''; }
  function novoId() {
    var c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', r = crypto.getRandomValues(new Uint8Array(20)), s = '';
    for (var i = 0; i < r.length; i++) s += c.charAt(r[i] % c.length);
    return 'op-' + s;
  }
  function refCurta(id) { return String(id || '').replace(/^op-/, '').slice(0, 6).toUpperCase(); }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem('garrafoes2.' + k); localStorage.setItem('garrafoes2.' + k, v); } catch (e) { return null; } return null; }
  var toastT = null;

  /* ===================== dados calculados ===================== */

  // lotes de novos = marca + fabricação

  /* ---------- históricos ---------- */

  /* ---------- gestão ---------- */

    return '<div class="cfg"><h2>Perfis de acesso</h2><p class="nota" style="margin-top:0">Quem só “Usa” o módulo fica com o perfil escolhido aqui. <b>Contagem e entradas</b>: entradas de novos com foto da nota e contagens físicas. <b>Entregas</b>: vendas com assinatura, trocas com cliente e retiradas de sucata. A gestão é quem tem “Gerencia” no módulo Garrafões em Cadastros › Acesso ao app.</p>' + perfis + '</div>' +
      '<div class="cfg"><h2>Parâmetros</h2><form id="form-cfg"><div class="campos">' +
      ORDEM.map(function (m) {
        return '<label>Mínimo de novos · ' + esc(MODELOS[m].curto) + '<span class="dica">Abaixo disso, o app avisa</span><input type="number" min="0" step="1" inputmode="numeric" id="c-min-' + m + '" value="' + c.produtos[m].minimo + '" required></label>' +

      '<div class="cfg"><h2>Lançamentos excluídos</h2>' + exclHtml + '</div>' +

  /* ===================== formulários ===================== */
  function abrirForm(tipo) {
    if (!pode(tipo)) { toast('Esta operação não está disponível aqui.'); return; }
    if (F && F.tipo === tipo) { fecharForm(); return; }
    if (F && F.enviando) return;
    F = {
      tipo: tipo, id: novoId(), modelo: S.modelo, data: hoje(), obs: '', erro: '', revisao: false, enviando: false,
      marca: marcas(S.modelo).length === 1 ? marcas(S.modelo)[0] : '', fab: '', qtd: '', vinculo: '', foto: '',

      recolhido: '', recolhidoOutro: '', contra: '',

  function campoData() { return '<label>Data da movimentação<input type="date" data-f="data" value="' + esc(F.data) + '" max="' + hoje() + '" required></label>'; }

  function opcoesLotes(C, marca, sel) {

    if (t === 'troca') sub = 'O cliente entrega sucatas e recebe novos. Tudo é gravado junto, depois da assinatura do cliente.';
    if (t === 'retirada') sub = 'Sucata recolhida para reciclagem. Baixa o saldo de sucata de ' + MODELOS[F.modelo].curto + ', seja quem for que recolheu.';

  // ---- entrada (com foto da nota) ----

    var lim = new Date(); lim.setDate(lim.getDate() - 180);

      '<label>Fabricação (mês/ano)<input type="month" data-f="fab" value="' + esc(F.fab) + '" max="' + mesAtual() + '" required><span class="info-lote" id="d-lote"></span></label>' +
      '<label>Quantidade (unidades)<input type="number" data-f="qtd" value="' + esc(F.qtd) + '" min="1" step="1" inputmode="numeric" required></label>' +

        }).join('') + '</select></label>' : '') +
      '<div class="campo largo campo-foto">Foto da nota do recebimento <span class="dica">obrigatória · só foto tirada agora pela câmera (não aceita galeria nem arquivo)</span>' +
      (F.foto ? '<img class="foto-prev" src="' + F.foto + '" alt="Foto da nota"><div><button type="button" class="btn sec" data-act="foto">Tirar a foto de novo</button></div>'
        : '<button type="button" class="btn-foto" data-act="foto">📷 Tirar foto da nota</button>') + '</div></div>';

      l.map(function (x, i) {

          '<td class="q"><input type="number" min="0" max="' + x.saldo + '" step="1" inputmode="numeric" data-f="saida.' + esc(x.k) + '" value="' + esc(F.saida[x.k] || '') + '" aria-label="Quantidade da fabricação ' + mesBR(x.fabricacao) + '"></td></tr>';
      }).join('') + '</tbody></table></div></div>';

      if (campo === 'marca') { F.saida = {}; }
      if (campo === 'alvo') { F.contado = {}; F.achados = []; }
      F.erro = ''; renderForm(); return;
    }
    var a = b.getAttribute('data-act');
    if (a === 'modelo') {
      var m = b.getAttribute('data-m'); if (m === S.modelo) return;
      if (F) { toast('Conclua ou cancele o formulário aberto para trocar de modelo.'); return; }
      S.modelo = m; ls('modelo', m); S.fil.novos.lote = ''; S.fil.novos.marca = ''; S.fil.lotes.marca = ''; S.limite = PASSO_HIST; render(); return;
    }
    if (a === 'abrir') { abrirForm(b.getAttribute('data-tipo')); return; }
    if (a === 'fechar') { fecharForm(); return; }
    if (a === 'revisar') { revisar(); return; }
    if (a === 'voltar') { if (F && !F.enviando) { F.revisao = false; renderForm(); } return; }
    if (a === 'confirmar') { confirmar(); return; }
    if (a === 'limpar-assin') { if (F && !F.enviando) { F.ass = null; renderForm(); } return; }
    if (a === 'foto') { abrirCamera(); return; }
    if (a === 'cam-foto') { fotografar(); return; }
    if (a === 'cam-refazer') { pararCamera(); abrirCamera(); return; }
    if (a === 'cam-usar') { if (F && CAM.foto) { F.foto = CAM.foto; F.erro = ''; } fecharCamera(); renderForm(); return; }
    if (a === 'cam-fechar') { fecharCamera(); return; }
    if (a === 'zoom') { b.classList.toggle('grande'); return; }
    if (a === 'mais' && F) {
      var lista = b.getAttribute('data-lista');
      var novo = lista === 'sucata' ? { motivo: '', desc: '', qtd: '' } : lista === 'novos' ? { marca: '', lote: '', qtd: '' } : { marca: '', fab: '', contado: '' };
      if (F[lista].length >= 12) { toast('Linhas demais numa operação só.'); return; }
      F[lista].push(novo); renderForm(); return;
    }
    if (a === 'tirar' && F) { F[b.getAttribute('data-lista')].splice(Number(b.getAttribute('data-i')), 1); renderForm(); return; }
    if (a === 'usar-sugestao' && F) { F.novos[0].qtd = b.getAttribute('data-v'); renderForm(); return; }
    if (a === 'aba') { S.aba = b.getAttribute('data-aba'); S.limite = PASSO_HIST; S.msgCfg = S.msgCsv = null; if (S.aba === 'config') carregarGestao(); render(); var ab = $('abas'); if (ab && b.closest('#area-topo')) ab.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (a === 'ver-lotes') { S.aba = 'lotes'; S.fil.lotes.marca = b.getAttribute('data-marca'); render(); var ab2 = $('abas'); if (ab2) ab2.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (a === 'ver-mais') { S.limite += PASSO_HIST; render(); return; }
    if (a === 'op') { abrirOp(b.getAttribute('data-id')); return; }
    if (a === 'fechar-modal') { fecharModal(); return; }
    if (a === 'excluir-ini' && M) { M.excluir = true; M.erro = ''; renderModal(); return; }
    if (a === 'excluir-nao' && M) { M.excluir = false; M.erro = ''; renderModal(); return; }
    if (a === 'excluir-ok') { excluir(Number(b.getAttribute('data-n')) || 1); return; }
    if (a === 'csv') { exportar(b.getAttribute('data-qual')); return; }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.hasAttribute('data-f') && F) {
      setCaminho(F, t.getAttribute('data-f'), t.value);
      var f = t.getAttribute('data-f');
      if (f === 'total' && F.sucata.length === 1) { F.sucata[0].qtd = t.value; var q = document.querySelector('[data-f="sucata.0.qtd"]'); if (q) q.value = t.value; }
      if (F.erro) { F.erro = ''; var cx = document.querySelector('#painel-form .erro-caixa'); if (cx) cx.remove(); }
      atualizarDerivados();
      return;
    }
    if (t.id === 'm-motivo' && M) M.motivo = t.value;
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.hasAttribute('data-f') && F) {
      setCaminho(F, t.getAttribute('data-f'), t.value);
      if (t.tagName === 'SELECT') {
        var f = t.getAttribute('data-f');
        if (/^novos\.\d+\.marca$/.test(f)) { var i = Number(f.split('.')[1]); F.novos[i].lote = ''; var sug = lotesDe(calcular(), F.modelo, t.value, true)[0]; if (sug) F.novos[i].lote = sug.k; }
        renderForm();
      } else atualizarDerivados();
      return;
    }
    if (t.hasAttribute('data-filtro')) {
      var p = t.getAttribute('data-filtro').split('.');
      S.fil[p[0]][p[1]] = t.type === 'checkbox' ? t.checked : t.value;
      if (p[0] === 'novos' && p[1] === 'marca') S.fil.novos.lote = '';
      S.limite = PASSO_HIST; render(); return;
    }
    if (t.hasAttribute('data-perfil-ref')) { mudarPerfil(t.getAttribute('data-perfil-ref'), t.value, t); return; }
  });
  document.addEventListener('submit', function (ev) { if (ev.target && ev.target.id === 'form-cfg') salvarCfg(ev); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') { if (!$('cam').hidden) fecharCamera(); else if (M) fecharModal(); } });
  document.addEventListener('focusout', function () { setTimeout(function () { if (F && !F.revisao && S.pendenteForm && !$('painel-form').contains(document.activeElement)) { S.pendenteForm = false; renderForm(); } }, 0); });
  window.addEventListener('pagehide', pararCamera);

  /* ===================== dados ao vivo ===================== */
  function aoMudarOps(snap) {
    var novo = {};
    snap.docs.forEach(function (d) { novo[d.id] = d.data(); });
    S.ops = novo; S.carregou.ops = true;
    Object.keys(S.loc.ops).forEach(function (id) { if (novo[id]) delete S.loc.ops[id]; });
    Object.keys(S.loc.del).forEach(function (id) { if (!novo[id]) delete S.loc.del[id]; });
    if (F && $('painel-form') && $('painel-form').contains(document.activeElement)) S.pendenteForm = true;
    render();
  }
  function conferirPerfil() {
    return S.db.rpc('garrafoes_eu', {}).then(function (r) {
      var antes = S.perfil;
      S.perfil = (r && r.perfil) || ''; S.nome = (r && r.nome) || S.nome; S.ref = (r && r.ref) || '';
      if (antes && antes !== S.perfil) { if (F && !pode(F.tipo)) { F = null; renderForm(); } if (S.aba === 'config' && S.perfil !== 'gestao') S.aba = 'novos'; toast('Seu perfil no módulo mudou para: ' + (PERFIS[S.perfil] || 'sem acesso') + '.'); }
      if (S.perfil === 'gestao' && !S.exclLigado) { S.exclLigado = true; S.db.collection('g-excluidas').onSnapshot(function (snap) { var o = {}; snap.docs.forEach(function (d) { o[d.id] = d.data(); }); S.excl = o; if (S.aba === 'config') render(); }, function () {}); }
      render();
    });
  }
  function iniciar() {
    render();
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      S.db = r[0]; var u = r[1];
      if (!S.db || !u) throw { code: 'not_granted' };
      return (u.nome ? u.nome() : u.me().then(function (x) { return x.name; })).then(function (n) { S.nome = n || ''; return conferirPerfil(); });
    }).then(function () {
      S.pronto = true;
      S.db.collection('g-ops').onSnapshot(aoMudarOps, function (e) { S.erro = e || { code: 'unavailable' }; render(); });
      S.db.doc('config/geral').onSnapshot(function (s) { S.cfgDoc = s.exists ? s.data() : null; S.carregou.cfg = true; render(); }, function () { S.carregou.cfg = true; });
      S.db.doc('g-perfis/perfis').onSnapshot(function () { if (S.pronto) conferirPerfil().catch(function () {}); }, function () {});
      render();
    }).catch(function (e) { S.erro = e || { code: 'unavailable' }; render(); });
  }
  iniciar();
})();
</script>
