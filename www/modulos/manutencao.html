<meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Manutenção · LEVÍSSIMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: painel andon — colunas por linha de produção, chamados como etiquetas de manutenção; aço frio com azul-água. */
:root{
  --bg:#edf1f5; --surface:#ffffff; --surface-2:#f6f8fa; --sunken:#e4eaf0;
  --ink:#0f1a24; --ink-2:#41505d; --muted:#5d6b78; --line:#d5dde5; --line-2:#b7c3ce;
  --accent:#1d5fae; --accent-ink:#ffffff; --accent-soft:#e1ecf8; --accent-line:#9fc0e8;
  --chart:#2a78d6; --grid:#e3e8ed; --axis:#c3ccd5;
  --p1:#d03b3b; --p1-ink:#ffffff; --p2:#ec835a; --p2-ink:#2b1308; --p3:#fab219; --p3-ink:#2b1d00; --p4:#0ca30c; --p4-ink:#05230a;
  --ok:#0ca30c; --warn:#fab219; --crit:#d03b3b; --serious:#ec835a; --violet:#6250d6;
  --shadow:0 1px 2px rgba(15,26,36,.06),0 4px 14px rgba(15,26,36,.06);
  --shadow-lg:0 18px 50px rgba(15,26,36,.22);
  --scrim:rgba(9,16,23,.5);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --side-w:240px; --top-h:56px; --nav-h:64px;
}
@media not all{
  :root:not([data-theme="light"]){
    --bg:#0b1218; --surface:#121b24; --surface-2:#17222d; --sunken:#0e161d;
    --ink:#e6edf4; --ink-2:#a9b7c4; --muted:#8b99a6; --line:#233140; --line-2:#34475a;
    --accent:#4d9bef; --accent-ink:#06121f; --accent-soft:#132a42; --accent-line:#2b5a8c;
    --chart:#3987e5; --grid:#1f2c38; --axis:#2f4050;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
    --shadow-lg:0 18px 50px rgba(0,0,0,.55);
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1218; --surface:#121b24; --surface-2:#17222d; --sunken:#0e161d;
  --ink:#e6edf4; --ink-2:#a9b7c4; --muted:#8b99a6; --line:#233140; --line-2:#34475a;
  --accent:#4d9bef; --accent-ink:#06121f; --accent-soft:#132a42; --accent-line:#2b5a8c;
  --chart:#3987e5; --grid:#1f2c38; --axis:#2f4050;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  --shadow-lg:0 18px 50px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.small{font-size:13px}
.tiny{font-size:12px}
.nowrap{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}
.ico.lg{width:26px;height:26px}
.ico.fill{fill:currentColor;stroke:none}

/* ===== Shell ===== */
.app{min-height:100vh;display:flex}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--top-h);display:flex;align-items:center;gap:10px;padding-inline:16px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.01em}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.top .spacer{flex:1}
.view{flex:1;padding:18px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));width:100%;max-width:1320px;margin-inline:auto}
.view.full{max-width:none}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.bnav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.01em;border-radius:10px;min-height:50px;justify-content:center}
.bnav button[aria-current="page"]{color:var(--accent)}
.bnav .fab{color:var(--accent-ink);background:var(--accent);margin-top:-22px;min-height:58px;border-radius:16px;box-shadow:var(--shadow);width:min(84px,100%);justify-self:center}
.bnav .fab[aria-current="page"]{color:var(--accent-ink)}
.nb{position:absolute;top:3px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.nb.warn{background:var(--warn);color:#2b1d00}
.nb.info{background:var(--accent);color:var(--accent-ink)}

@media (min-width:1024px){
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;width:var(--side-w);flex:none;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;gap:4px;overflow-y:auto}
  .side .brand{padding:4px 10px 16px}
  .side .brand b{font-size:24px}
  .side .navsec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px;font-weight:600}
  .side button.nav{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:0;background:none;border-radius:9px;color:var(--ink-2);font-weight:600;font-size:14.5px;text-align:left}
  .side button.nav:hover{background:var(--surface-2);color:var(--ink)}
  .side button.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .side button.nav .nb{position:static;margin-left:auto}
  .side .open-cta{margin:4px 0 10px}
  .side .who{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
  .top .brand{display:none}
  .bnav{display:none}
  .view{padding:24px 28px 40px}
}

.gbanner{width:100%;max-width:1320px;margin-inline:auto;padding-inline:16px}
.gbanner:empty{display:none}
.gbanner .banner{margin:14px 0 0}
@media (min-width:1024px){.gbanner{padding-inline:28px}}
body.tv .gbanner{display:none}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:34px;padding:0 11px;font-size:13.5px;border-radius:8px}
.btn.lg{min-height:52px;padding:0 22px;font-size:16px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn-row.end{justify-content:flex-end}

/* ===== Chips, pills ===== */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-weight:600;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunken);color:var(--ink-2);border:1px solid transparent}
.pill .ico{width:14px;height:14px}
.pill.st-aberto{background:var(--surface-2);border-color:var(--line-2);color:var(--ink)}
.pill.st-atendimento{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
.pill.st-atendimento .ico{color:var(--accent)}
.pill.st-aguardando{background:color-mix(in srgb,var(--violet) 14%,var(--surface));border-color:color-mix(in srgb,var(--violet) 40%,var(--surface));color:var(--ink)}
.pill.st-aguardando .ico{color:var(--violet)}
.pill.st-concluido,.pill.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border-color:color-mix(in srgb,var(--ok) 40%,var(--surface));color:var(--ink)}
.pill.st-concluido .ico,.pill.ok .ico{color:var(--ok)}
.pill.st-cancelado{color:var(--muted);text-decoration:line-through}
.pill.warn{background:color-mix(in srgb,var(--warn) 22%,var(--surface));border-color:color-mix(in srgb,var(--warn) 55%,var(--surface));color:var(--ink)}
.pill.warn .ico{color:color-mix(in srgb,var(--warn) 70%,var(--ink))}
.pill.crit{background:color-mix(in srgb,var(--crit) 14%,var(--surface));border-color:color-mix(in srgb,var(--crit) 45%,var(--surface));color:var(--ink)}
.pill.crit .ico{color:var(--crit)}
.pill.info{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
.pill.info .ico{color:var(--accent)}
.pill.h1{background:var(--surface);border-color:var(--line-2);font-family:var(--f-mono);font-size:11px}
.prio{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 7px;border-radius:5px;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.prio.p1{background:var(--p1);color:var(--p1-ink)}
.prio.p2{background:var(--p2);color:var(--p2-ink)}
.prio.p3{background:var(--p3);color:var(--p3-ink)}
.prio.p4{background:var(--p4);color:var(--p4-ink)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dot.p1{background:var(--p1)}.dot.p2{background:var(--p2)}.dot.p3{background:var(--p3)}.dot.p4{background:var(--p4)}

/* ===== Layout helpers ===== */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;margin-bottom:16px}
.page-head h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.005em}
.page-head .sub{color:var(--ink-2);margin-top:4px;max-width:62ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1 1 220px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;min-width:0}
.panel>h2,.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.01em;margin-bottom:12px}
.panel-h h2{font:inherit}
.panel-h .ico{color:var(--muted)}
.sec-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 10px}
.hr{height:1px;background:var(--line);border:0;margin:14px 0}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:22px;border:1px dashed var(--line-2);border-radius:var(--r-lg);background:var(--surface-2);color:var(--ink-2)}
.empty h3{font-family:var(--f-display);font-size:20px;color:var(--ink)}
.empty.center{align-items:center;text-align:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--surface-2);margin-bottom:14px;font-size:14px}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 60%,var(--surface));background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.banner.crit{border-color:color-mix(in srgb,var(--crit) 50%,var(--surface));background:color-mix(in srgb,var(--crit) 10%,var(--surface))}
.banner .ico{margin-top:1px}
.banner.warn .ico{color:color-mix(in srgb,var(--warn) 70%,var(--ink))}
.banner.crit .ico{color:var(--crit)}
.banner .grow{flex:1;min-width:0}

/* ===== Forms ===== */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.flabel{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.01em}
.field .hint{font-size:12.5px;color:var(--muted)}
.field .err{font-size:12.5px;color:var(--crit);font-weight:600}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:15px}
textarea.inp{min-height:92px;resize:vertical;line-height:1.45}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.inp.invalid{border-color:var(--crit)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.form{display:flex;flex-direction:column;gap:16px}
.check{display:flex;align-items:center;gap:10px;font-weight:600;min-height:40px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.searchbox{position:relative}
.searchbox .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.searchbox .inp{padding-left:40px}
.toggle{display:inline-flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;min-height:40px;user-select:none}
.toggle input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line-2);position:relative;transition:background .15s;flex:none;cursor:pointer}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(18px)}
.toggle.crit input:checked{background:var(--crit)}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--sunken);gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:7px 13px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Big choice grids (abrir chamado) */
.choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr))}
.choices.lines{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.choice{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:60px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);text-align:left;color:var(--ink)}
.choice:hover{border-color:var(--ink-2)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.choice b{font-weight:700;font-size:15px;line-height:1.2}
.choice small{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.choice.line b{font-family:var(--f-display);font-size:26px;letter-spacing:.01em}
.choice.line small{font-family:var(--f-body)}
.prio-choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.pchoice{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);text-align:left}
.pchoice .sw{width:14px;align-self:stretch;border-radius:4px;flex:none}
.pchoice b{display:block;font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.pchoice span{font-size:13px;color:var(--ink-2)}
.pchoice[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.pchoice.p1 .sw{background:var(--p1)}.pchoice.p2 .sw{background:var(--p2)}.pchoice.p3 .sw{background:var(--p3)}.pchoice.p4 .sw{background:var(--p4)}
.pchoice.p1[aria-pressed="true"]{background:color-mix(in srgb,var(--p1) 10%,var(--surface))}
.pchoice.p2[aria-pressed="true"]{background:color-mix(in srgb,var(--p2) 12%,var(--surface))}
.pchoice.p3[aria-pressed="true"]{background:color-mix(in srgb,var(--p3) 16%,var(--surface))}
.pchoice.p4[aria-pressed="true"]{background:color-mix(in srgb,var(--p4) 12%,var(--surface))}
.step{display:flex;flex-direction:column;gap:10px}
.step-h{display:flex;align-items:baseline;gap:10px;font-family:var(--f-display);font-size:20px;font-weight:700}
.step-h .n{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:500}

/* ===== Andon strip ===== */
.andon{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.andon-t{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;min-width:0}
.andon-t:hover{border-color:var(--line-2)}
.andon-t .row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.andon-t b{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1}
.andon-t .lname{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lamp{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.lamp i{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.lamp.crit i{background:var(--crit);box-shadow:0 0 0 3px color-mix(in srgb,var(--crit) 25%,transparent);animation:pulse 1.4s ease-in-out infinite}
.lamp.warn i{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 28%,transparent)}
.lamp.info i{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--crit) 10%,transparent)}}
.andon-t .cnts{display:flex;gap:8px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.andon-t .cnts span{display:inline-flex;align-items:center;gap:4px}

/* ===== Stat tiles ===== */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px}
button.tile:hover{border-color:var(--line-2)}
.tile .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .val{font-size:28px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.tile .val small{font-size:15px;font-weight:600;color:var(--ink-2);margin-left:2px}
.tile .foot{font-size:12.5px;color:var(--ink-2)}
.tile.crit{border-color:color-mix(in srgb,var(--crit) 45%,var(--surface));background:color-mix(in srgb,var(--crit) 6%,var(--surface))}
.tile.warn{border-color:color-mix(in srgb,var(--warn) 60%,var(--surface));background:color-mix(in srgb,var(--warn) 9%,var(--surface))}

/* ===== Kanban ===== */
.board-wrap{margin-inline:-16px;padding-inline:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;padding-bottom:6px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,86vw);gap:12px;align-items:start}
@media (min-width:700px){.board{grid-auto-columns:minmax(270px,1fr)}}
@media (min-width:1024px){.board-wrap{margin-inline:0;padding-inline:0}}
.col{scroll-snap-align:start;background:var(--sunken);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-h{display:flex;flex-direction:column;gap:6px;padding:4px 4px 8px;border-bottom:1px solid var(--line)}
.col-h .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.col-h b{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.col-h .lname{font-size:12.5px;color:var(--muted)}
.col-h .cnts{display:flex;gap:6px;flex-wrap:wrap}
.col-h .cnts .pc{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.col-empty{padding:18px 10px;text-align:center;color:var(--muted);font-size:13.5px;border:1px dashed var(--line-2);border-radius:10px}
.linejump{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding-block:8px;margin-bottom:6px}
@media (min-width:1024px){.linejump{top:0}}

/* Ticket "etiqueta" card */
.tag{position:relative;display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;color:var(--ink);padding:0}
.tag:hover{border-color:var(--line-2)}
.tag .band{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px 6px 26px;font-family:var(--f-display);font-weight:700;font-size:14.5px;letter-spacing:.05em;text-transform:uppercase;position:relative}
.tag .band::before{content:"";position:absolute;left:9px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--surface);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.tag .band .no{font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:0}
.tag.p1 .band{background:var(--p1);color:var(--p1-ink)}
.tag.p2 .band{background:var(--p2);color:var(--p2-ink)}
.tag.p3 .band{background:var(--p3);color:var(--p3-ink)}
.tag.p4 .band{background:var(--p4);color:var(--p4-ink)}
.tag .body{display:flex;flex-direction:column;gap:4px;padding:10px 12px 10px}
.tag .eq{font-weight:700;font-size:15.5px;line-height:1.25}
.tag .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tag .desc{font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px dashed var(--line-2);font-size:13px}
.tag .timer{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--ink-2)}
.tag .timer.late{color:var(--crit)}
.tag .stop{display:flex;align-items:center;gap:6px;margin:-2px 0 2px;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--crit)}
.tag.new{animation:newtag 1.2s ease-in-out 4}
@keyframes newtag{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 55%,transparent)}}
.tag .line-chip{font-family:var(--f-display);font-weight:700;font-size:13px;padding:1px 7px;border-radius:5px;background:var(--sunken);color:var(--ink)}

/* ===== Lists / rows ===== */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);min-width:0;background:var(--surface);text-align:left;width:100%;border-left:0;border-right:0;border-bottom:0;color:var(--ink)}
.row:first-child{border-top:0}
button.row:hover,.row.clickable:hover{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .t1{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.row .t2{font-size:13px;color:var(--ink-2);margin-top:2px;overflow-wrap:anywhere}
.row .side-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;text-align:right}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:620px){.row.wrap-sm{flex-wrap:wrap}.row.wrap-sm .side-r{align-items:flex-start;text-align:left;width:100%;flex-direction:row;flex-wrap:wrap}}
.group-h{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface-2);border-top:1px solid var(--line);font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.group-h:first-child{border-top:0}
.ltag{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.02em;padding:2px 8px;border-radius:5px;background:var(--sunken);color:var(--ink);white-space:nowrap}

/* ===== Tables ===== */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}

/* ===== Overlays ===== */
#overlays{position:relative;z-index:100}
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.dlg{position:relative;background:var(--surface);color:var(--ink);width:100%;max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;border-radius:18px 18px 0 0;box-shadow:var(--shadow-lg);animation:up .2s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 12px 12px 18px;border-bottom:1px solid var(--line)}
.dlg-h h2{flex:1;font-family:var(--f-display);font-weight:700;font-size:22px;min-width:0}
.dlg-b{padding:16px 18px;overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0}
.dlg-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 18px 18px}
@media (min-width:760px){
  .scrim{align-items:center;padding:24px}
  .dlg{max-width:640px;border-radius:16px;max-height:calc(100dvh - 48px)}
  .dlg.wide{max-width:920px}
  .dlg-f{border-radius:0 0 16px 16px}
  .scrim.drawer{justify-content:flex-end;align-items:stretch;padding:0}
  .scrim.drawer .dlg{max-width:620px;border-radius:0;max-height:none;height:100%;animation:slide .2s ease-out}
  .scrim.drawer .dlg-f{border-radius:0}
}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@keyframes slide{from{transform:translateX(30px);opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;gap:8px;width:min(480px,calc(100% - 32px));pointer-events:none}
@media (min-width:1024px){.toasts{bottom:24px}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--surface);box-shadow:var(--shadow-lg);font-weight:600;font-size:14px;animation:up .2s ease-out}
.toast.crit{background:var(--crit);color:#fff}
.toast .grow{flex:1;min-width:0}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:4px}

/* Ticket detail */
.tk-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.times{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:8px;margin:12px 0}
.time-c{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.time-c .l{font-size:12px;color:var(--muted);font-weight:600}
.time-c .v{font-family:var(--f-mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.time-c.hl{background:var(--accent-soft);border-color:var(--accent-line)}
.blk{margin-top:16px}
.blk h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.quote{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.timeline .ev{position:relative;padding:4px 0 10px;font-size:13.5px}
.timeline .ev::before{content:"";position:absolute;left:-20px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.timeline .ev .w{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sol{border:1px solid color-mix(in srgb,var(--ok) 40%,var(--surface));background:color-mix(in srgb,var(--ok) 7%,var(--surface));border-radius:12px;padding:12px 14px}

/* Knowledge */
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kcard .kh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--ink-2)}
.kcard .kp{font-weight:700;overflow-wrap:anywhere}
.kcard .ks{font-size:14px;overflow-wrap:anywhere}
.kcard .ks b{color:var(--ink-2);font-weight:700}
.kcard mark{background:color-mix(in srgb,var(--warn) 35%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.match{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.suggest{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:10px}
.suggest>.sh{display:flex;align-items:center;gap:8px;font-weight:700}
.ai{background:var(--surface);border:1px solid var(--accent-line);border-radius:var(--r-lg);padding:14px 16px;min-width:0}
.ai .ai-h{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
.ai .ai-h .ico{color:var(--accent)}
.ai-t{font-size:15px;overflow-wrap:anywhere}
.ai-t p{margin:0 0 8px}
.ai-t ol,.ai-t ul{margin:4px 0 10px;padding-left:22px}
.ai-t li{margin:3px 0}
.ai-t h4{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:12px 0 6px}
.oslink{border:0;background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono);font-weight:600;font-size:13px;border-radius:5px;padding:0 5px}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:600}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

/* Plans */
.due{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.due .d{font-family:var(--f-mono);font-weight:600;font-size:14px}
.due .r{font-size:12.5px;color:var(--ink-2)}
.cal{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.cal .wk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.cal .wk h4{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.cal .it{display:flex;gap:6px;align-items:baseline;font-size:13.5px;padding:3px 0;border-top:1px dashed var(--line)}
.cal .it:first-of-type{border-top:0}

/* Charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:12px}
.chart .lbl-v{fill:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chart .lbl-c{fill:var(--ink-2)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{stroke:var(--axis);stroke-width:1}
.chart .bar{fill:var(--chart)}
.chart .bar.dim{fill:color-mix(in srgb,var(--chart) 38%,var(--surface))}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover+.bar,.chart g.b:hover .bar{fill:color-mix(in srgb,var(--chart) 80%,var(--ink))}
.chart .tgt{stroke:var(--ink);stroke-width:2}
.chart-tip{position:fixed;z-index:300;pointer-events:none;background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:13px;box-shadow:var(--shadow-lg);max-width:260px}
.chart-tip b{display:block;font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--ink)}

/* Profile / misc */
.who-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:13.5px;max-width:200px;min-height:40px}
.who-chip .av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.who-chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.mode.local i{background:var(--warn)}
.mode.off i{background:var(--crit)}
.more-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.more-grid button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;text-align:left;position:relative;min-height:88px}
.more-grid button .ico{color:var(--accent)}
.more-grid button .nb{top:10px;right:10px}
.progress{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.meter{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden;width:72px}
.meter i{display:block;height:100%}
.parts-row{display:grid;grid-template-columns:1fr 92px 40px;gap:8px;align-items:end}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600;padding:30px 4px}
.kbd{font-family:var(--f-mono);font-size:12px;background:var(--sunken);padding:1px 6px;border-radius:4px}
details.adv{border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
details.adv>summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.adv>summary::-webkit-details-marker{display:none}
details.adv[open]>summary{border-bottom:1px solid var(--line)}
details.adv>.in{padding:14px}

/* ===== Modo TV ===== */
body.tv .side,body.tv .bnav,body.tv .top,body.tv .no-tv{display:none!important}
body.tv .view{padding:16px 20px;max-width:none}
body.tv .tvbar{display:flex}
.tvbar{display:none;align-items:center;gap:16px;margin-bottom:14px}
.tvbar .clock{font-family:var(--f-mono);font-size:30px;font-weight:600;margin-left:auto}
.tvbar h1{font-family:var(--f-display);font-size:34px;font-weight:700}
body.tv .board{grid-auto-columns:minmax(240px,1fr)}
body.tv .tag .eq{font-size:18px}
body.tv .tag .band{font-size:17px}
body.tv .tag .desc{font-size:15px}
body.tv .col-h b{font-size:38px}

/* ===== Complementos ===== */
.row.clickable{cursor:pointer}
.tag.done{opacity:.8}
.tag.done .band{filter:saturate(.3)}
.time-c .v.late{color:var(--crit)}
.blk-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.blk-h h3{margin:0}
.saldo-n{font-variant-numeric:tabular-nums;white-space:nowrap}
.saldo-n b{font-size:18px;font-weight:700}
.saldo-big{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin-top:6px}
.saldo-big b{font-size:38px;font-weight:600;line-height:1;letter-spacing:-.01em}
.saldo-big span{flex-basis:100%}
.sla-row{display:grid;grid-template-columns:minmax(150px,max-content) minmax(0,1fr);gap:10px;align-items:end}
.sla-row>.prio,.sla-row>.ltag{justify-self:start;margin-bottom:12px}
@media (max-width:520px){.sla-row{grid-template-columns:1fr}.sla-row>.prio,.sla-row>.ltag{margin-bottom:0}}
.imp-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.tec-chip{padding-right:4px;color:var(--ink)}
.tec-chip .x{border:0;background:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:var(--muted);padding:0}
.tec-chip .x:hover{background:var(--sunken);color:var(--ink)}
.toolbar select.inp{width:auto}
.dlg-f .small.muted{flex:1 1 200px}

/* ===== Ajustes de layout ===== */
[hidden]{display:none!important}
.row{flex-wrap:wrap}
.row .grow{flex:1 1 200px}
.row .side-r{flex:0 1 auto;min-width:0;max-width:100%;margin-left:auto}
.row .side-r .small{white-space:normal}
.andon-t .row1,.col-h .r1{flex-wrap:wrap;row-gap:4px}
.lamp{letter-spacing:.04em}
.top .brand{min-width:0;overflow:hidden}
@media (max-width:700px){
  .top .mode .mtx,.top .nm-s{display:none}
  .top .mode i{width:10px;height:10px}
  .kb-leg{display:none}
  .who-chip{max-width:160px}
}

/* ===== Gráficos ===== */
.hb{display:flex;flex-direction:column;gap:10px}

const pad = n => String(n).padStart(2, '0');
function toISODate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseISODate(s) {
  if (!s) return null;

  if (!m) return null;
  return new Date(+m[1], +m[2] - 1, +m[3]);
}
const hoje = () => toISODate(new Date());
function addDays(iso, n) { const d = parseISODate(iso); if (!d) return null; d.setDate(d.getDate() + Math.round(n)); return toISODate(d); }

const msToISO = ms => toISODate(new Date(ms));

function fmtData(iso) { const d = parseISODate(iso); return d ? pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() : '—'; }
function fmtDataC(iso) { const d = parseISODate(iso); return d ? pad(d.getDate()) + '/' + pad(d.getMonth() + 1) : '—'; }
function fmtHora(ms) { if (!ms) return '—'; const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtDH(ms) { if (!ms) return '—'; const d = new Date(ms); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtDHc(ms) {
  if (!ms) return '—';
  const iso = msToISO(ms), h = hoje();
  if (iso === h) return 'hoje ' + fmtHora(ms);
  if (iso === addDays(h, -1)) return 'ontem ' + fmtHora(ms);
  const d = new Date(ms); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + fmtHora(ms);

function fmtDur(ms) {
  if (ms == null || isNaN(ms)) return '—';

function parseNumBR(v) {
  if (v == null || v === '') return null;

/* =====================================================================
   Dados: banco compartilhado (dentro do Claude) ou deste aparelho

const NO_CLAUDE = !(window.claude && typeof window.claude.use === 'function');
function capP(name) {
  if (NO_CLAUDE) return Promise.resolve(null);
  try { return Promise.resolve(window.claude.use(name)).catch(() => null); } catch (e) { return Promise.resolve(null); }
}
const CapP = { db: capP('db'), user: capP('user'), sample: capP('sample'), downloads: capP('downloads') };
const Caps = { sample: null, downloads: null };
CapP.sample.then(v => { Caps.sample = v; }); CapP.downloads.then(v => { Caps.downloads = v; });

const COLS = ['equipamentos', 'elementos', 'chamados', 'preventivas', 'lubrificacao', 'pecas', 'movimentos', 'ferramentas', 'config', 'fichas'];
const LKEY = 'lev.db.';

const Store = {
  mode: 'loading',        // cloud | local | offline | revoked
  data: {},
  loaded: new Set(),
  uid: null, canWrite: null, canAdmin: false, isOwner: false,
  readOnly: false,
  holder: 'h' + uid(),
  listeners: new Set(),
  unsubs: {},
  retries: {},
  arquivo: null,
  _arqP: null,
  db: null
};
COLS.forEach(c => { Store.data[c] = new Map(); });

Store.all = col => Array.from((Store.data[col] || new Map()).values());
Store.get = (col, id) => (Store.data[col] && Store.data[col].get(id)) || null;
Store.on = fn => { Store.listeners.add(fn); return () => Store.listeners.delete(fn); };
Store.emit = (col, first) => { for (const fn of Store.listeners) { try { fn(col, first); } catch (e) { console.error(e); } } };
Store.isReady = () => Store.loaded.size >= COLS.length;

Store.init = async function () {
  if (NO_CLAUDE) { Store.startLocal(); return; }
  const db = await CapP.db;
  if (!db) { Store.mode = 'offline'; Store.readOnly = true; COLS.forEach(c => Store.loaded.add(c)); Store.emit('*'); return; }
  Store.db = db; Store.mode = 'cloud';
  const user = await CapP.user;
  if (user) {
    try { Store.uid = await user.id(); } catch (e) { /* sem id */ }
    try { Store.canWrite = await user.can('data.write'); } catch (e) { /* desconhecido */ }
    try { Store.canAdmin = await user.canEdit(); } catch (e) { /* não */ }
    try { Store.isOwner = await user.isOwner(); } catch (e) { /* não */ }
  }
  if (Store.canWrite === false) Store.readOnly = true;
  COLS.forEach(c => Store.subscribe(c));
  setTimeout(() => { if (!Store.isReady()) { COLS.forEach(c => Store.loaded.add(c)); Store.emit('*'); } }, 9000);
};

Store.subscribe = function (col) {
  let q = Store.db.collection(col);
  if (col === 'movimentos') q = q.orderBy('data', 'desc').limit(1000);
  try {
    Store.unsubs[col] = q.onSnapshot(snap => {
      const m = new Map();
      for (const d of snap.docs) { const v = d.data(); if (v) m.set(d.id, Object.assign({}, v, { id: d.id })); }
      Store.data[col] = m;
      const first = !Store.loaded.has(col);
      Store.loaded.add(col);
      Store.emit(col, first);
    }, err => Store.subErr(col, err));
  } catch (e) { Store.subErr(col, e); }
};
Store.subErr = function (col, err) {
  const code = err && err.code;
  console.warn('Falha ao acompanhar ' + col, err);

/* Trava curta (lease) para contador e saldo de estoque */
Store.withLock = async function (path, fn) {
  if (Store.mode !== 'cloud') return fn(null);
  Store.assertWrite();
  const ref = Store.db.doc(path);
  for (let i = 0; i < 14; i++) {
    let r;
    try { r = await ref.acquire({ holder: Store.holder, ttlMs: 3000 }); } catch (e) {
      if (e && e.code === 'unavailable' && i < 3) { await sleep(500); continue; }
      throw Store.mapErr(e);
    }
    if (r && r.acquired) return fn(ref);
    const left = r && r.expiresAt ? Date.parse(r.expiresAt) - Date.now() : 600;
    await sleep(Math.min(3200, Math.max(150, left)) + Math.random() * 250);
  }
  throw { code: 'ocupado', message: 'Registro em uso por outra pessoa. Tente de novo.' };
};

Store.nextNumber = async function () {
  const maxLocal = Store.all('chamados').reduce((m, c) => Math.max(m, typeof c.n === 'number' ? c.n : 0), 0);
  if (Store.mode !== 'cloud') {
    const cur = (Store.get('config', 'contador') || {}).chamado || 0;
    const n = Math.max(cur, maxLocal) + 1;
    await Store.set('config', 'contador', { chamado: n });
    return n;
  }
  try {
    return await Store.withLock('config/contador', async ref => {
      const s = await ref.get();
      const cur = s.exists ? ((s.data() || {}).chamado || 0) : 0;
      const n = Math.max(cur, maxLocal) + 1;
      await ref.set({ chamado: n });
      return n;

  } catch (e) {
    if (e && (e.code === 'somente_leitura' || e.code === 'sem_permissao')) throw e;

  for (let i = 0; i < text.length; i++) {

    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch;

    else if (ch === delim) { row.push(cur); cur = ''; }

    } else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }

  const comResp = lista.filter(c => c.inicioEm);
  const dentroSLA = comResp.filter(c => (c.inicioEm - c.abertoEm) <= slaMin(c.prioridade) * 60000).length;
  const paradaMs = lista.filter(c => c.parada && c.status !== 'cancelado').reduce((s, c) => s + tempos(c, Math.min(agora, f.ate)).total, 0);
  const porLinha = LINHAS.map(l => {
    const ls = lista.filter(c => c.linha === l.id);
    return { id: l.id, nome: l.curto, n: ls.length, paradaH: ls.filter(c => c.parada && c.status !== 'cancelado').reduce((s, c) => s + tempos(c, agora).total, 0) / 3600000 };
  });
  const eqMap = new Map();
  for (const c of lista) {
    const k = c.equipId || ('x:' + c.equipNome);
    const e = eqMap.get(k) || { nome: eqNome(c), tag: eqTag(c), linha: c.linha, n: 0, horas: 0, paradaH: 0 };
    e.n++; const t = tempos(c, agora); e.horas += t.total / 3600000; if (c.parada) e.paradaH += t.total / 3600000;
    eqMap.set(k, e);
  }
  const porEquip = Array.from(eqMap.values()).sort((a, b) => b.n - a.n || b.horas - a.horas);
  const porTipo = TIPOS_FALHA.map(t => ({ nome: t, n: lista.filter(c => c.tipo === t).length })).filter(x => x.n).sort((a, b) => b.n - a.n);
  const semanas = new Map();
  for (let w = inicioSemana(f.de); w < f.ate; w += 7 * 86400000) semanas.set(inicioSemana(w + 3600000), 0);
  for (const c of lista) { const k = inicioSemana(c.abertoEm); semanas.set(k, (semanas.get(k) || 0) + 1); }
  const porSemana = Array.from(semanas.entries()).sort((a, b) => a[0] - b[0]).map(([k, n]) => ({ nome: fmtDataC(msToISO(k)), n }));
  const porPrio = [1, 2, 3, 4].map(p => {
    const ls = comResp.filter(c => c.prioridade === p);
    return { p, n: lista.filter(c => c.prioridade === p).length, resp: media(ls.map(c => c.inicioEm - c.abertoEm)), sla: slaMin(p) * 60000 };
  });
  const horasPeriodo = Math.max(1, (Math.min(f.ate, agora) - f.de) / 3600000);
  const falhas = lista.filter(c => c.status !== 'cancelado').length;
  return {
    lista, concl,
    n: lista.length, nConcl: concl.length, nAbertos: lista.filter(c => !fechado(c)).length, nCancel: lista.filter(c => c.status === 'cancelado').length,
    mediaTotal: media(tc.map(t => t.total)), mttr: media(tc.map(t => t.reparo).filter(v => v != null)), mediaResp: media(comResp.map(c => c.inicioEm - c.abertoEm)),
    mediaEspera: media(tc.map(t => t.espera)),
    paradaH: paradaMs / 3600000, pctSLA: comResp.length ? dentroSLA / comResp.length : null, nComResp: comResp.length,
    mtbf: falhas ? horasPeriodo / falhas : null,
    porLinha, porEquip, porTipo, porSemana, porPrio
  };
}

/* ---------- Avisos de novos chamados e relógio ---------- */
const Avisos = { conhecidos: null, som: LS.get('lev.som', false) };
let _audio = null;
function bip(vezes) {
  try {
    _audio = _audio || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = _audio.currentTime + 0.02;
    for (let i = 0; i < vezes; i++) {
      const o = _audio.createOscillator(), g = _audio.createGain();
      o.type = 'square'; o.frequency.value = i % 2 ? 660 : 880;
      const t = t0 + i * 0.32;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
      o.connect(g); g.connect(_audio.destination); o.start(t); o.stop(t + 0.28);
    }
  } catch (e) { /* som indisponível */ }
}
function checarNovos() {
  if (!Store.loaded.has('chamados')) return;
  const abertos = Store.all('chamados').filter(c => !fechado(c));
  const ids = new Set(abertos.map(c => c.id));
  if (!Avisos.conhecidos) { Avisos.conhecidos = ids; return; }
  const novos = abertos.filter(c => !Avisos.conhecidos.has(c.id) && Date.now() - (c.abertoEm || 0) < 15 * 60000);
  Avisos.conhecidos = ids;
  for (const c of novos) {
    UI.novos.set(c.id, Date.now());
    if (UI.criadosAqui.has(c.id)) continue;
    if (ehManutencao() || document.body.classList.contains('tv')) {
      toast('Novo chamado #' + num4(c.n) + ' · ' + linhaCurto(c.linha) + ' · ' + eqNome(c) + ' (P' + c.prioridade + ')', c.prioridade === 1 ? 'crit' : '', { txt: 'Ver', fn: () => abrirChamado(c.id) });
      if (Avisos.som) bip(c.prioridade === 1 ? 4 : 2);
    }
  }
}
function tick() {
  const agora = Date.now();
  for (const el of $$('[data-since]')) {
    const t = agora - (+el.dataset.since);
    const tt = $('.tt', el) || el;
    tt.textContent = fmtDur(t);
    if (el.dataset.sla) el.classList.toggle('late', t > +el.dataset.sla);
  }
  const ck = $('.tvbar .clock'); if (ck) ck.textContent = fmtHora(agora);

/* ---------- Gráficos de barras (HTML) com dica ao passar o dedo ---------- */
function barras(dados, o) {
  o = o || {};
  if (!dados.length || !dados.some(d => d.v > 0)) return '<p class="muted small">Sem dados no período.</p>';
  const fmt = o.fmt || (v => fmtNum(v, o.dec == null ? 0 : o.dec));
  const max = Math.max(...dados.map(d => Math.max(d.v, d.alvo || 0))) || 1;
  const tip = d => esc(d.tip || (d.nome + ': ' + fmt(d.v)));
  if (o.horizontal) {
    return '<div class="hb" role="img" aria-label="' + esc(o.titulo || 'Gráfico') + '"' + (o.labW ? ' style="--lw:' + Math.min(o.labW, 220) + 'px"' : '') + '>' + dados.map(d => {
      const w = d.v > 0 ? Math.max(1, d.v / max * 80) : 0;
      return '<div class="hb-r" data-tip="' + tip(d) + '"><span class="hb-l" title="' + esc(d.nome) + '">' + esc(d.nome) + '</span><span class="hb-t">'
        + (w ? '<i class="hb-b' + (d.dim ? ' dim' : '') + '" style="width:' + w.toFixed(2) + '%"></i>' : '')
        + '<span class="hb-v" style="left:calc(' + w.toFixed(2) + '% + 6px)">' + esc(fmt(d.v)) + '</span></span></div>';
    }).join('') + '</div>';
  }
  let passo = niceStep(max);
  if (passo < 1 && dados.every(d => Number.isInteger(d.v))) passo = 1;
  const top = Math.ceil(max / passo) * passo || 1;
  const n = dados.length, cada = Math.ceil(n / 10);
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += passo) g += '<div class="vb-g' + (v === 0 ? ' base' : '') + '" style="bottom:' + (v / top * 100).toFixed(2) + '%"><span>' + esc(fmt(v)) + '</span></div>';
  const cols = dados.map(d => {
    const h = d.v / top * 100;
    return '<div class="vb-c" data-tip="' + tip(d) + '">' + (d.v > 0 ? '<i class="vb-b' + (d.dim ? ' dim' : '') + '" style="height:' + h.toFixed(2) + '%"></i>' : '')
      + (d.alvo ? '<i class="vb-alvo" style="bottom:' + (d.alvo / top * 100).toFixed(2) + '%"></i>' : '')
      + (o.rotulos !== false && d.v > 0 && n <= 14 ? '<span class="vb-v" style="bottom:calc(' + h.toFixed(2) + '% + 3px)">' + esc(fmt(d.v)) + '</span>' : '') + '</div>';
  }).join('');
  return '<div class="vb" role="img" aria-label="' + esc(o.titulo || 'Gráfico') + '"><div class="vb-plot">' + g + '<div class="vb-cols">' + cols + '</div></div>'
    + '<div class="vb-x">' + dados.map((d, i) => '<span>' + (i % cada === 0 ? esc(d.nome) : '') + '</span>').join('') + '</div></div>';
}
function niceStep(max) {
  const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw || 1))), m = raw / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
}
let _tip = null;
document.addEventListener('pointermove', e => {
  const g = e.target.closest && e.target.closest('.hb-r[data-tip], .vb-c[data-tip]');
  if (!g) { if (_tip) _tip.hidden = true; return; }
  if (!_tip) { _tip = document.createElement('div'); _tip.className = 'chart-tip'; document.body.appendChild(_tip); }
  _tip.textContent = g.dataset.tip;
  _tip.hidden = false;
  const x = Math.max(8, Math.min(window.innerWidth - 270, e.clientX + 14)), y = e.clientY + 16;
  _tip.style.left = x + 'px'; _tip.style.top = y + 'px';
});

  return '<button type="button" class="tag p' + c.prioridade + (novo ? ' new' : '') + (done ? ' done' : '') + '" data-act="os" data-id="' + c.id + '" aria-label="Chamado ' + num4(c.n) + ', ' + esc(eqNome(c)) + ', prioridade ' + c.prioridade + '">'

    + (c.parada && !done ? '<span class="stop">' + ico('stop', 'sm') + ' Linha parada</span>' : '')
    + (o.mostraLinha ? '<span><span class="line-chip">' + esc(linhaCurto(c.linha)) + '</span></span>' : '')
    + '<span class="eq">' + esc(eqNome(c)) + '</span>'
    + '<span class="meta">' + esc(eqTag(c) || 'sem tag') + ' · ' + esc(c.tipo || '') + ((c.fotos || []).length ? ' · 📷 ' + c.fotos.length : '') + '</span>'
    + '<span class="desc">' + esc(c.descricao) + '</span></span>'
    + '<span class="foot">' + (done
      ? '<span class="timer">' + ico('check', 'sm') + '<span>' + fmtDur(t.total) + '</span></span>'
      : '<span class="timer' + (late ? ' late' : '') + '" data-since="' + c.abertoEm + '"' + (c.inicioEm ? '' : ' data-sla="' + slaMin(c.prioridade) * 60000 + '"') + ' title="Tempo desde a abertura">' + ico('clock', 'sm') + '<span class="tt">' + fmtDur(t.total) + '</span></span>')

function celTempo(rot, val, o) {

function resumoTexto(c) {

function detalheChamado(c) {

  const respLate = t.resposta != null && t.resposta > sla;
  let h = '<div class="tk-head">' + prioChip(c.prioridade) + statusPill(c) + (c.parada && !done ? pill('crit', 'stop', 'Linha parada') : '') + (c.parada && done ? pill('', 'stop', 'Parou a linha') : '') + ltag(c.linha)
    + (c.arquivado ? pill('', 'archive', 'Arquivado') : '') + (c.reaberturas ? pill('warn', 'refresh', 'Reaberto ' + c.reaberturas + 'x') : '')

  h += '<div class="times">'

    + celTempo('Tempo de resposta', fmtDur(t.resposta), { since: t.respostaRodando ? c.abertoEm : null, late: respLate, sub: 'meta ' + fmtDur(sla) + (t.resposta != null ? (respLate ? ' · fora da meta' : ' · dentro da meta') : '') })

  if (c.origem && c.origem.tipo === 'provisorio') h += '<p class="small" style="margin-top:8px">' + ico('info', 'sm') + ' Ação definitiva do chamado <button type="button" class="oslink" data-act="osn" data-n="' + c.origem.n + '">#' + num4(c.origem.n) + '</button></p>';
  h += levMateriaisHtml(c);
  if (c.status === 'cancelado') h += '<div class="blk"><h3>Motivo do cancelamento</h3><div class="quote">' + esc(c.canceladoMotivo || '—') + '</div></div>';
  if (c.solucao && c.status === 'concluido') {
    const s = c.solucao;
    h += '<div class="blk"><h3>Solução registrada</h3><div class="sol stack" style="gap:8px">'
      + (s.causa ? '<div><b>Causa:</b> ' + esc(s.causa) + '</div>' : '')
      + '<div><b>O que foi feito:</b> ' + esc(s.acao) + '</div>'
      + (s.intervencao ? '<div class="small ink2"><b>Intervenção:</b> ' + esc(String(s.intervencao).split('|').join(', ')) + '</div>' : '')
      + ((s.pecas || []).length ? '<div class="small"><b>Peças:</b> ' + s.pecas.map(p => esc(fmtNum(p.qtd) + ' ' + (p.un || '') + ' · ' + (p.codigo ? p.codigo + ' ' : '') + (p.descricao || ''))).join('; ') + '</div>' : '')
      + (s.provisoria ? '<div>' + pill('warn', 'alert', 'Solução provisória') + '</div>' : '')
      + (s.obs ? '<div class="small ink2">' + esc(s.obs) + '</div>' : '') + '</div></div>';

  if (!done && !c.arquivado) {
    const sug = KB.buscar(c.descricao, { equipId: c.equipId, equipTipo: c.equipTipo, linha: c.linha, tipo: c.tipo, excluirId: c.id, limite: 3 });
    h += '<div class="blk"><h3>Soluções anteriores parecidas</h3>' + (sug.length ? '<div class="stack" style="gap:8px">' + sug.map(x => kcard(x, true)).join('') + '</div>' : '<p class="small ink2">Nenhum caso parecido no histórico ainda.</p>')
      + iaBloco('os-' + c.id, () => 'Como resolver este chamado?') + '</div>';
  }
  const evs = (c.eventos || []).slice().reverse();
  if (evs.length) h += '<div class="blk"><h3>Histórico</h3><div class="timeline">' + evs.map(e => '<div class="ev"><div class="w">' + fmtDH(e.t) + (e.por ? ' · ' + esc(e.por) : '') + '</div>' + esc(e.texto) + '</div>').join('') + '</div></div>';
  return h;
}
function rodapeChamado(c) {

FORMS['os-concluir'] = async (f, btn) => {
  const c = Store.get('chamados', f.dataset.id); if (!c) return;
  const d = dadosForm(f);
  if (!d.acao) return toast('Descreva o que foi feito.', 'crit');
  if (!d.tecnico) return toast('Informe o técnico.', 'crit');
  let pecas; try { pecas = lerPecas(f); } catch (e) { return toast(e.message, 'crit'); }
  const ini = parseDtLocal(d.inicio), fim = parseDtLocal(d.fim);
  if (!ini || !fim) return toast('Confira a data e hora do início e da conclusão.', 'crit');
  if (ini < c.abertoEm - 60000) return toast('O início não pode ser antes da abertura (' + fmtDH(c.abertoEm) + ').', 'crit');
  if (fim < ini) return toast('A conclusão não pode ser antes do início.', 'crit');
  if (fim > Date.now() + 5 * 60000) return toast('A conclusão não pode ficar no futuro.', 'crit');
  for (const p of pecas) {
    const pc = Store.get('pecas', p.pecaId);
    if (pc && (+pc.saldo || 0) < p.qtd) {
      const ok = await confirmar({ titulo: 'Saldo insuficiente', texto: esc(pecaLabel(pc)) + ' tem saldo de ' + fmtNum(pc.saldo) + ' ' + esc(pc.unidade || '') + '. Registrar mesmo assim? O saldo fica negativo até a entrada ser lançada.', ok: 'Registrar mesmo assim' });
      if (!ok) return;
    }
  }
  await ocupado(btn, async () => {
    const r = await OS.concluir(c, { causa: d.causa, acao: d.acao, intervencao: d.intervencao, pecas, tecnico: d.tecnico, inicioEm: ini, fimEm: fim, provisoria: d.provisoria === '1', obs: d.obs });
    Modal.close();
    toast('Chamado #' + num4(c.n) + ' concluído em ' + fmtDur(fim - c.abertoEm) + '.');
    if (r.falhas.length) toast('Não deu para baixar do estoque: ' + r.falhas.join(', ') + '. Lance a saída em Estoque.', 'crit');
    if (r.seguimento) toast('Aberto o chamado #' + num4(r.seguimento.n) + ' para a ação definitiva.');
  }, 'Concluindo…');
};

function mdLeve(txt) {
  const linhas = String(txt || '').replace(/\r/g, '').split('\n');
  let h = '', lista = null;
  const fecha = () => { if (lista) { h += '</' + lista + '>'; lista = null; } };
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^&\w])#(\d{1,6})\b/g, (m, a, n) => a + '<button type="button" class="oslink" data-act="osn" data-n="' + (+n) + '">#' + String(+n).padStart(4, '0') + '</button>');
  for (const l of linhas) {
    const t = l.trim(); let m;
    if (!t) { fecha(); continue; }
    if ((m = /^#{1,4}\s+(.*)$/.exec(t))) { fecha(); h += '<h4>' + inl(m[1]) + '</h4>'; continue; }
    if ((m = /^(\d+)[.)]\s+(.*)$/.exec(t))) { if (lista !== 'ol') { fecha(); h += '<ol>'; lista = 'ol'; } h += '<li>' + inl(m[2]) + '</li>'; continue; }
    if ((m = /^[-*\u2022]\s+(.*)$/.exec(t))) { if (lista !== 'ul') { fecha(); h += '<ul>'; lista = 'ul'; } h += '<li>' + inl(m[1]) + '</li>'; continue; }
    fecha(); h += '<p>' + inl(t) + '</p>';
  }
  fecha();
  return h;
}

async function iaPerguntar(key, pergunta, contexto, opcoes) {

  const busca = (pergunta + ' ' + (contexto || ''));

    update() {
      if (!this.el || !this.el.isConnected) return;

        + '<button type="button" class="tile" data-act="pl-filtro" data-col="' + col + '" data-e="ok"><span class="lbl">Em dia</span><span class="val">' + cnt('ok') + '</span></button>'

    row(x) {

      }

FORMS['pl-salvar'] = async (f, btn) => {
  const col = f.dataset.col, id = f.dataset.id || uid(), antigo = f.dataset.id ? Store.get(col, f.dataset.id) : null;
  const d = dadosForm(f), lub = col === 'lubrificacao';
  if (!d.equipId) return toast('Escolha o equipamento.', 'crit');
  const fd = parseNumBR(d.freqDias), fh = parseNumBR(d.freqHoras);
  const tipo = lub ? 'dias' : (d.freqTipo || 'dias');
  if (tipo === 'horas' && !(fh > 0)) return toast('Informe a cada quantas horas.', 'crit');
  if (tipo === 'dias' && !(fd > 0)) return toast('Informe a cada quantos dias.', 'crit');
  const obj = Object.assign({}, antigo || {}, {
    equipId: d.equipId, freqTipo: tipo, freqDias: fd || null, freqHoras: tipo === 'horas' ? fh : null,
    ultimaData: d.ultimaData || null, proximaData: d.ultimaData ? null : (d.proximaData || null),
    ultimaHoras: tipo === 'horas' ? parseNumBR(d.ultimaHoras) : null, responsavel: d.responsavel || '', atualizadoEm: Date.now()
  });
  if (!antigo) { obj.criadoEm = Date.now(); obj.ativo = true; obj.historico = []; }
  if (lub) {
    if (!d.ponto) return toast('Informe o ponto de lubrificação.', 'crit');
    const pc = acharPeca(d.lubrificante);
    Object.assign(obj, { ponto: d.ponto, lubrificante: pc ? pc.descricao : d.lubrificante, pecaId: pc ? pc.id : null, quantidade: parseNumBR(d.quantidade), unidade: d.unidade, metodo: d.metodo, h1: d.h1 === '1', obs: d.obs || '' });
  } else {
    if (!d.titulo) return toast('Informe a tarefa.', 'crit');
    let pecas; try { pecas = lerPecas(f).map(x => ({ pecaId: x.pecaId, qtd: x.qtd })); } catch (e) { return toast(e.message, 'crit'); }
    Object.assign(obj, { titulo: d.titulo, descricao: d.descricao || '', checklist: (d.checklist || '').split('\n').map(s => s.trim()).filter(Boolean), duracaoMin: parseNumBR(d.duracaoMin), requerParada: d.requerParada === '1', pecas });
  }
  await ocupado(btn, async () => { await Store.set(col, id, obj); Modal.close(); toast(antigo ? 'Alterações salvas.' : 'Incluído no plano.'); });
};

function fichaItens(e) { return Array.isArray(e && e.ficha) ? e.ficha.filter(x => x && (x.k || x.v)) : []; }

        freqTipo: t.freqTipo, freqHoras: t.freqTipo === 'horas' ? (oleo ? hOleo : ar ? hAr : t.freqHoras) : null, freqDias: t.freqDias || null,
        ultimaData: null, proximaData: null, ultimaHoras: oleo && ult != null ? ult : null, responsavel: 'Manutenção', duracaoMin: t.duracaoMin || null, requerParada: !!t.requerParada,
        pecas: [], ativo: true, historico: [], origem: 'modelo-compressor', criadoEm: agora, atualizadoEm: agora
      });
      n++;
    }
    const jaLb = Store.all('lubrificacao').filter(p => p.equipId === e.id).map(p => norm(p.ponto));
    for (const l of MODELO_COMPRESSOR.lubrificacao) {

      n++;
    }
    Modal.close();
    toast(n ? n + ' itens criados em ' + e.nome + '. Informe a última execução de cada tarefa para os alertas funcionarem.' : 'O modelo já estava aplicado neste compressor.');
  }, 'Aplicando…');
};

FORMS.mov = async (f, btn) => {
  const tipo = f.dataset.tipo, d = dadosForm(f);
  const p = d.pecaId ? Store.get('pecas', d.pecaId) : acharPeca(d.peca);
  if (!p) return toast('Escolha uma peça cadastrada na lista.', 'crit');
  if (!d.por) return toast('Informe o responsável.', 'crit');
  const o = { pecaId: p.id, tipo, por: d.por, obs: d.obs || '' };
  if (tipo === 'ajuste') {
    const nv = parseNumBR(d.novo);
    if (nv == null || nv < 0) return toast('Informe o saldo contado.', 'crit');
    if (nv === (+p.saldo || 0)) return toast('O saldo contado é igual ao atual. Nada a ajustar.');
    o.novoSaldo = nv;
  } else {
    const q = parseNumBR(d.qtd);
    if (!(q > 0)) return toast('Informe a quantidade.', 'crit');
    o.qtd = q;
    if (tipo === 'saida' && q > (+p.saldo || 0)) {
      if (!await confirmar({ titulo: 'Saldo insuficiente', texto: 'O saldo de ' + esc(pecaLabel(p)) + ' é ' + fmtNum(p.saldo) + ' ' + esc(p.unidade || '') + '. Registrar mesmo assim? O saldo fica negativo até a entrada ser lançada.', ok: 'Registrar' })) return;
    }
  }
  if (d.os) { const c = Store.get('chamados', d.os); if (c) { o.origem = { tipo: 'chamado', id: c.id, n: c.n }; if (!o.obs) o.obs = 'Chamado #' + num4(c.n); } }
  await ocupado(btn, async () => {
    const s = await Store.moverEstoque(o);
    Modal.close();
    toast(TIPO_MOV[tipo] + ' registrada. Saldo de ' + p.descricao + ': ' + fmtNum(s) + ' ' + (p.unidade || '') + '.');
  });
};

/* =====================================================================
   Ferramentas: uso coletivo (empréstimo), individual (kits) e calibração
   ===================================================================== */
function stFerr(f) {
  const s = statusFerr(f);
  if (f.falta && f.estado !== 'baixada') return Object.assign({}, s, { cls: 'crit', txt: 'Faltou na conferência' });
  return s;
}
function histFerr(f, tipo, texto, por) { return (f.historico || []).concat([{ t: Date.now(), tipo, texto, por: por || nomeUsuario() || '' }]).slice(-50); }
function rowFerr(f, o) {
  o = o || {};
  const s = stFerr(f);
  let acts = '';
  if (podeEscrever() && f.estado !== 'baixada') {
    if (o.calib) acts = '<button type="button" class="btn sm" data-act="fr-calib" data-id="' + f.id + '">' + ico('ruler', 'sm') + ' Registrar calibração</button>';
    else if (f.tipo !== 'individual') acts = f.emprestimo ? '<button type="button" class="btn sm" data-act="fr-devolver" data-id="' + f.id + '">' + ico('back', 'sm') + ' Devolver</button>' : '<button type="button" class="btn sm" data-act="fr-emprestar" data-id="' + f.id + '">' + ico('swap', 'sm') + ' Emprestar</button>';
  }
  let dir;
  if (o.calib) {
    const c = s.calib || {};
    dir = stPill({ cls: c.estado === 'vencida' ? 'crit' : c.estado === 'alerta' || c.estado === 'semdata' ? 'warn' : 'ok', txt: c.estado === 'vencida' ? 'Calibração vencida' : c.estado === 'semdata' ? 'Sem data de calibração' : c.estado === 'alerta' ? 'Vence em ' + c.dias + ' ' + plural(c.dias, 'dia') : 'Em dia' })
      + '<span class="tiny muted">' + (c.proxima ? 'próxima ' + fmtData(c.proxima) : 'informe a última calibração') + '</span>';
  } else {
    dir = stPill({ cls: s.cls, txt: s.txt }) + (f.ultimaConferencia ? '<span class="tiny muted">conferida em ' + fmtData(f.ultimaConferencia) + '</span>' : '');
  }
  const sub = [f.categoria, f.marca, f.tipo === 'individual' ? '' : f.local].filter(Boolean);
  return '<div class="row clickable wrap-sm" data-act="ferr" data-id="' + f.id + '" role="button" tabindex="0"><span class="grow"><span class="t1" style="display:block">' + esc(f.descricao) + '</span>'
    + '<span class="t2" style="display:block"><span class="mono">' + esc(f.codigo || 'sem código') + '</span>' + sub.map(x => ' · ' + esc(x)).join('')
    + (f.emprestimo && f.emprestimo.previsao ? ' · devolver até ' + fmtData(f.emprestimo.previsao) : '') + '</span></span>'
    + '<span class="side-r">' + dir + (acts ? '<span class="acts">' + acts + '</span>' : '') + '</span></div>';
}

VIEWS.ferramentas = {

      + '<div id="fr-body"></div>';
    this.update();
  },
  lista() {

      && (!q || norm([f.descricao, f.codigo, f.marca, f.categoria, f.local, f.responsavel, f.emprestimo && f.emprestimo.para].join(' ')).includes(q)));

    const col = todas.filter(f => f.tipo !== 'individual'), ind = todas.filter(f => f.tipo === 'individual');
    const emp = col.filter(f => f.emprestimo), atras = col.filter(f => stFerr(f).atrasada);

      body.innerHTML = vazio('Nenhuma ferramenta cadastrada', 'Cadastre as ferramentas de uso coletivo (que ficam no almoxarifado e são emprestadas) e as de uso individual (o kit de cada técnico). Instrumentos de medição podem ter controle de calibração.',
        podeEscrever() ? '<button type="button" class="btn" data-act="importar" data-tipo="ferramentas">' + ico('upload') + ' Importar planilha</button><button type="button" class="btn pri" data-act="fr-novo">' + ico('plus') + ' Nova ferramenta</button>' : '');
      return;

/* =====================================================================
   Relatórios: tempos de atendimento, indicadores e exportação
   ===================================================================== */
const PERIODOS = [['7', '7 dias'], ['30', '30 dias'], ['mes', 'Este mês'], ['mesant', 'Mês passado'], ['90', '90 dias'], ['custom', 'Personalizado']];
function periodoRel(p, de, ate) {
  const d0 = new Date(); d0.setHours(0, 0, 0, 0);
  const amanha = d0.getTime() + 86400000;
  if (p === '7' || p === '30' || p === '90') return { de: d0.getTime() - (+p - 1) * 86400000, ate: amanha, nome: 'Últimos ' + p + ' dias' };
  if (p === 'mes') return { de: new Date(d0.getFullYear(), d0.getMonth(), 1).getTime(), ate: amanha, nome: d0.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }) };
  if (p === 'mesant') { const i = new Date(d0.getFullYear(), d0.getMonth() - 1, 1); return { de: i.getTime(), ate: new Date(d0.getFullYear(), d0.getMonth(), 1).getTime(), nome: i.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }) }; }
  const a = isoToMs(de) || d0.getTime() - 29 * 86400000, b = (isoToMs(ate) || d0.getTime()) + 86400000;
  return { de: Math.min(a, b - 86400000), ate: Math.max(b, a + 86400000), nome: fmtData(msToISO(Math.min(a, b - 86400000))) + ' a ' + fmtData(msToISO(Math.max(b, a + 86400000) - 86400000)) };
}
function minutos(ms) { return ms == null ? '' : Math.round(ms / 6000) / 10; }
function execucoesNoPeriodo(col, de, ate) {
  const out = [];
  for (const p of Store.all(col)) for (const x of (p.historico || [])) {
    const t = isoToMs(x.data); if (t == null || t < de || t >= ate) continue;
    out.push({ p, x, atraso: x.prevista && x.data > x.prevista ? diffDays(x.prevista, x.data) : 0 });
  }
  return out;
}

      + '<div class="btn-row"><button type="button" class="btn pri" data-act="rel-exportar">' + ico('download') + ' Exportar Excel</button></div></div>'

      + '<select class="inp" style="width:auto;min-width:140px" aria-label="Linha" data-ch="rel-linha">' + opts(LINHAS.map(l => ({ v: l.id, l: l.nome })), this.f.linha, 'Todas as linhas') + '</select>'
      + '<select class="inp" style="width:auto;min-width:140px" aria-label="Prioridade" data-ch="rel-prio">' + opts([1, 2, 3, 4].map(p => ({ v: p, l: 'P' + p + ' ' + PRIORIDADES[p].nome })), this.f.prio, 'Todas as prioridades') + '</select></div>'
      + '<div id="rel-body"></div>';

  },

    const { per, r } = this.dados();
    const filtros = [per.nome, this.f.linha ? linhaNome(this.f.linha) : 'todas as linhas', this.f.prio ? 'P' + this.f.prio : ''].filter(Boolean).join(' · ');
    let h = '<p class="small ink2" style="margin-bottom:10px">' + esc(filtros) + (Store.arquivo ? '' : ' · carregando histórico arquivado…') + '</p>';
    h += '<div class="tiles">'

async function salvarCfg(patch) {
  if (Store.get('config', 'geral')) await Store.update('config', 'geral', patch);
  else await Store.set('config', 'geral', patch);
}
async function comRetry(fn) {
  for (let i = 0; ; i++) {
    try { return await fn(); } catch (e) {
      if (e && (e.code === 'resource_exhausted' || e.code === 'unavailable' || e.code === 'ocupado') && i < 5) { await sleep(700 * Math.pow(2, i) + Math.random() * 400); continue; }
      throw e;
    }
  }
}
async function emLote(itens, n, fn, prog) {
  let i = 0, feitos = 0;
  const erros = [];
  const run = async () => {
    while (i < itens.length) {
      const k = i++;
      try { await comRetry(() => fn(itens[k], k)); } catch (e) { erros.push({ item: itens[k], msg: (e && e.message) || String(e) }); }
      feitos++;
      if (prog) prog(feitos, itens.length);
    }
  };
  await Promise.all(Array.from({ length: Math.max(1, Math.min(n, itens.length)) }, run));
  return erros;
}

  if (!os.length && !mov.length) return toast('Nada com mais de ' + dias + ' dias para arquivar.');

    const out = []; let cur = [], tam = 0;

/* ---------- Planilha: baixar a ficha preenchida ou o modelo em branco ---------- */
function fiMesesModelo(ref) {
  const n = Math.max(12, (ref.meses || []).length || 15);
  const d0 = parseISODate((ref.meses || [])[0] || hoje());
  const dia = d0 ? d0.getDate() : 1;
  let ini = hoje().slice(0, 8) + pad(Math.min(dia, 28));
  if (ini < hoje()) ini = fiSomarMeses(ini, 1);
  const out = [ini];
  for (let i = 1; i < n; i++) out.push(fiSomarMeses(ini, i));
  return out;
}
async function fiExportar(f, vazia) {

  const M = meses.length, c0 = 5, cl = c0 + Math.max(M, 1) - 1, cr = Math.max(cl, 19), W = cr + 1;
  const nova = () => new Array(W).fill('');
  const aoa = [];
  aoa.push(nova());
  const r2 = nova(); r2[1] = 'FICHA DE MANUTENÇÃO PREVENTIVA'; r2[cr - 2] = 'APROVADO'; r2[cr - 1] = 'VERIFICADO'; r2[cr] = 'Nº CONTROLE'; aoa.push(r2);
  const r3 = nova(); if (!vazia) { r3[cr - 2] = f.aprovado || ''; r3[cr - 1] = f.verificado || ''; r3[cr] = f.controle || ''; } aoa.push(r3);
  const e = eqDe(f.equipId);
  const r4 = nova();
  r4[1] = 'LINHA: ' + (vazia ? '' : (f.linhaTxt || linhaCurto(f.linha)));
  r4[3] = 'EQUIPAMENTO: ' + (vazia ? '' : (f.equipamento || (e && e.nome) || ''));
  r4[6] = 'FABRICANTE: ' + (vazia ? '' : (f.fabricante || (e && e.fabricante) || ''));
  r4[11] = 'MODELO: ' + (vazia ? '' : (f.modelo || (e && e.modelo) || ''));
  r4[15] = 'LEGENDA:   O = Normal   X = Anormal   NA = Não aplicável';
  aoa.push(r4);
  aoa.push(nova());
  const r6 = nova(); r6[c0] = vazia ? [...new Set(meses.map(m => m.slice(0, 4)))].join(' e ') : (f.periodo || ''); aoa.push(r6);
  const r7 = nova(); r7[1] = 'Nº'; r7[2] = 'ITEM'; r7[3] = 'FREQUÊNCIA'; r7[4] = 'MÉTODO'; meses.forEach((m, j) => { r7[c0 + j] = fmtData(m); }); aoa.push(r7);
  const itens = vazia ? Array.from({ length: 12 }, (x, i) => ({ n: i + 1 })) : (f.itens || []);
  for (const it of itens) {
    const r = nova(); r[1] = it.n;
    if (!vazia) {
      const p = it.prevId ? Store.get('preventivas', it.prevId) : null;
      r[2] = (p && p.titulo) || it.titulo || ''; r[3] = it.frequencia || ''; r[4] = it.metodo || '';
      const cel = fiCelulas(f, it, p);
      cel.forEach((c, j) => { r[c0 + j] = c.e === 'na' ? 'NA' : c.e === 'o' ? 'O' : c.e === 'x' ? 'X' : ''; });
    }
    aoa.push(r);
  }
  const rr = nova(); rr[4] = 'RESPONSÁVEL:'; aoa.push(rr);
  const ra = nova(); ra[4] = 'ASSINATURA:'; aoa.push(ra);
  const ws = X.utils.aoa_to_sheet(aoa);
  ws['!merges'] = [{ s: { r: 5, c: c0 }, e: { r: 5, c: cl } }, { s: { r: 3, c: 15 }, e: { r: 3, c: cr } }, { s: { r: 1, c: 1 }, e: { r: 2, c: cr - 3 } }];
  ws['!cols'] = Array.from({ length: W }, (x, i) => ({ wch: i === 0 ? 2 : i === 1 ? 5 : i === 2 ? 42 : i === 3 ? 13 : i === 4 ? 14 : 11 }));
  const lista = [['Lista de Componentes e Materiais para Preventiva', '', '', ''], ['Item', 'Descrição', 'Fornecedor', 'Quantidade']];
  if (vazia) for (let i = 1; i <= 12; i++) lista.push([i, '', '', '']);
  else for (const it of f.itens || []) lista.push([it.n, it.descricao || '', it.fornecedor || '', it.quantidade == null ? '' : it.quantidade]);
  const wl = X.utils.aoa_to_sheet(lista);
  wl['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 3 } }];
  wl['!cols'] = [{ wch: 6 }, { wch: 70 }, { wch: 22 }, { wch: 12 }];
  const wb = X.utils.book_new();

  X.utils.book_append_sheet(wb, ws, nomeAba);

  const buf = X.write(wb, { bookType: 'xlsx', type: 'array' });

  return salvarArquivo(nome, new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}

ACT['fi-gravar'] = async el => {
  const st = FI.st; if (st.etapa !== 'previa') return;
  const sel = st.fichas.filter(x => x.incluir); if (!sel.length) return;
  const agora = Date.now(), por = nomeUsuario() || '';
