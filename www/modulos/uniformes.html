<title>Uniformes e EPI · LEVÍSSIMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Conceito: ficha de almoxarifado — chão de concreto frio, cartões brancos de ordem de serviço,
   azul do sinal de "uso obrigatório" para ações, verde/amarelo/vermelho de segurança para situação. */
:root {
  --bg: #ecf0f3;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --surface-3: #e6ebef;
  --ink: #0f1d2a;
  --ink-2: #3a4b5b;
  --muted: #627385;
  --line: #d8e0e7;
  --line-strong: #b6c3cf;
  --accent: #0f5aa6;
  --accent-hover: #0b4b8b;
  --accent-ink: #ffffff;
  --accent-soft: #e2edf8;
  --chart-bar: #a9c5e4;
  --ok: #1a7343;
  --ok-soft: #dff1e6;
  --warn: #855600;
  --warn-strong: #e9a700;
  --warn-soft: #fff0c7;
  --danger: #b3261e;
  --danger-soft: #fbe2df;
  --on-danger: #ffffff;
  --paper: #ffffff;
  --paper-line: #c5cfd8;
  --paper-hint: #8a97a4;
  --overlay: rgba(9, 18, 27, 0.48);
  --tooltip-bg: #0f1d2a;
  --tooltip-ink: #ffffff;
  --shadow-1: 0 1px 2px rgba(15, 29, 42, 0.06);
  --shadow-2: 0 18px 48px rgba(15, 29, 42, 0.22);
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', sans-serif;
  --font-body: 'Barlow', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r-sm: 7px;
  --r-md: 11px;
  --r-lg: 15px;
  --sidebar-w: 236px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0b1218;
    --surface: #121b23;
    --surface-2: #17222c;
    --surface-3: #1f2c37;
    --ink: #e4ecf2;
    --ink-2: #b6c4d0;
    --muted: #8a9bab;
    --line: #233240;
    --line-strong: #36495b;
    --accent: #5ea4ee;
    --accent-hover: #7db6f3;
    --accent-ink: #06121d;
    --accent-soft: #14304b;
    --chart-bar: #2c5682;
    --ok: #5ccb93;
    --ok-soft: #11301f;
    --warn: #f2c14e;
    --warn-strong: #f2c14e;
    --warn-soft: #33290f;
    --danger: #f27c74;
    --danger-soft: #3b1816;
    --on-danger: #2a0907;
    --paper: #ffffff;
    --paper-line: #c5cfd8;
    --paper-hint: #8a97a4;
    --overlay: rgba(0, 0, 0, 0.62);
    --tooltip-bg: #e4ecf2;
    --tooltip-ink: #0b1218;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-2: 0 18px 48px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0b1218;
  --surface: #121b23;
  --surface-2: #17222c;
  --surface-3: #1f2c37;
  --ink: #e4ecf2;
  --ink-2: #b6c4d0;
  --muted: #8a9bab;
  --line: #233240;
  --line-strong: #36495b;
  --accent: #5ea4ee;
  --accent-hover: #7db6f3;
  --accent-ink: #06121d;
  --accent-soft: #14304b;
  --chart-bar: #2c5682;
  --ok: #5ccb93;
  --ok-soft: #11301f;
  --warn: #f2c14e;
  --warn-strong: #f2c14e;
  --warn-soft: #33290f;
  --danger: #f27c74;
  --danger-soft: #3b1816;
  --on-danger: #2a0907;
  --paper: #ffffff;
  --paper-line: #c5cfd8;
  --paper-hint: #8a97a4;
  --overlay: rgba(0, 0, 0, 0.62);
  --tooltip-bg: #e4ecf2;
  --tooltip-ink: #0b1218;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-2: 0 18px 48px rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

/* ---------- Base ---------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
html.modal-aberto,
html.modal-aberto body {
  overflow: hidden;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
.ic {
  flex: none;
}
.mudo {
  color: var(--muted);
  font-weight: 400;
}
.oculto {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
.mono {
  font-family: var(--font-mono);
}
.txt-erro {
  color: var(--danger);
}
.espaco {
  flex: 1;
}
.link {
  border: 0;
  background: none;
  padding: 0;
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 2px;
  font-variant-numeric: tabular-nums;
}
.link-bloco {
  border: 0;
  background: none;
  padding: 0;
  text-align: left;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* ---------- Estrutura ---------- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  min-height: 100vh;
  min-height: 100dvh;
}
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  overflow-y: auto;
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 22px;
  padding: 20px 14px 18px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 6px;
}
.marca-disco {
  fill: var(--accent);
}
.marca-figura {
  fill: var(--accent-ink);
}
.brand-nome {
  font: 700 18px/1.05 var(--font-display);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.brand-org {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 4px;
  line-height: 1.25;
}
.nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav button {
  display: flex;
  align-items: center;
  gap: 11px;
  height: 42px;
  padding: 0 11px;
  border: 0;
  border-radius: 9px;
  background: none;
  color: var(--ink-2);
  font: 600 14.5px/1 var(--font-body);
  text-align: left;
}
.nav button:hover {
  background: var(--surface-2);
  color: var(--ink);
}
.nav button[aria-current='page'] {
  background: var(--accent-soft);
  color: var(--accent);
}
.nav-badge {
  margin-left: auto;
  min-width: 22px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--danger);
  color: var(--on-danger);
  font: 700 11.5px/20px var(--font-body);
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.sidebar-pe {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  padding: 0 6px;
}
.sidebar-pe p {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.4;
}
.conteudo {
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.topo-mobile {
  display: none;
}
.main {
  width: 100%;
  max-width: 1240px;
  margin-inline: auto;
  padding-inline: clamp(16px, 3vw, 36px);
  padding-block: 26px 56px;
  min-width: 0;
}
.pagina {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.pagina-estreita {
  max-width: 860px;
}

/* ---------- Cabeçalho de página ---------- */
.pagehead {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px 20px;
}
.pagehead-txt {
  min-width: 0;
}
.eyebrow {
  font: 600 12.5px/1.2 var(--font-display);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.titulo {
  font: 700 34px/1.05 var(--font-display);
  letter-spacing: 0.005em;
  text-wrap: balance;
}
.pagehead-sub {
  color: var(--muted);
  margin-top: 6px;
}
.pagehead-acoes {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

/* ---------- Botões ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 40px;
  padding: 0 15px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  font: 600 14px/1 var(--font-body);
  white-space: nowrap;
  text-decoration: none;
  transition: background-color 0.12s, border-color 0.12s;
}
.btn:hover:not(:disabled) {
  background: var(--surface-2);
  border-color: var(--muted);
}
.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}
.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--accent);
}
.btn-ghost:hover:not(:disabled) {
  background: var(--accent-soft);
  border-color: transparent;
}
.btn-perigo {
  color: var(--danger);
  border-color: var(--line-strong);
}
.btn-perigo-txt {
  color: var(--danger);
}
.btn-perigo-txt:hover:not(:disabled) {
  background: var(--danger-soft);
}
.btn-perigo-cheio {
  background: var(--danger);
  border-color: var(--danger);
  color: var(--on-danger);
}
.btn-perigo-cheio:hover:not(:disabled) {
  background: var(--danger);
  border-color: var(--danger);
  filter: brightness(1.08);
}
.btn-sm {
  height: 32px;
  padding: 0 11px;
  font-size: 13px;
  gap: 6px;
}
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: var(--r-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-2);
}
.icon-btn:hover {
  background: var(--surface-2);
  color: var(--ink);
}
.acoes-inline {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.confirmar {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--danger);
}

/* ---------- Pílulas, etiquetas, avatares ---------- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  background: var(--surface-3);
  color: var(--ink-2);
  font: 600 12.5px/1 var(--font-body);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.pill::before {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  flex: none;
}
.pill.plain::before {
  background: var(--muted);
}
.pill.ok {
  background: var(--ok-soft);
  color: var(--ok);
}
.pill.warn {
  background: var(--warn-soft);
  color: var(--warn);
}
.pill.warn::before {
  background: var(--warn-strong);
}
.pill.danger {
  background: var(--danger-soft);
  color: var(--danger);
}
.pill.info {
  background: var(--accent-soft);
  color: var(--accent);
}
.pill.info::before {
  display: none;
}
.tag {
  display: inline-flex;
  align-items: center;
  height: 21px;
  padding: 0 6px;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  background: var(--surface);
  color: var(--ink-2);
  font: 500 11.5px/1 var(--font-mono);
  letter-spacing: 0.01em;
  white-space: nowrap;
  vertical-align: 1px;
}
.avatar {
  flex: none;
  display: inline-grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  font: 700 14px/1 var(--font-display);
  letter-spacing: 0.04em;
}
.avatar.apagado {
  background: var(--surface-3);
  color: var(--muted);
}
.carimbo {
  flex: none;
  width: 52px;
  border: 1.5px solid var(--line-strong);
  border-radius: 9px;
  padding: 6px 0 5px;
  text-align: center;
  line-height: 1;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.carimbo b {
  font: 700 22px/1 var(--font-display);
  font-variant-numeric: tabular-nums;
}
.carimbo span {
  font: 600 11px/1 var(--font-display);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.carimbo i {
  font: 500 10px/1 var(--font-body);
  font-style: normal;
  color: var(--muted);
}
.carimbo.pequeno {
  width: 44px;
  padding: 5px 0 4px;
}
.carimbo.pequeno b {
  font-size: 18px;
}
.carimbo.pequeno i {
  display: none;
}

/* ---------- Cartões e listas ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  min-width: 0;
}
.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 15px 18px 13px;
  border-bottom: 1px solid var(--line);
}
.card-titulo {
  font: 600 19px/1.15 var(--font-display);
  letter-spacing: 0.01em;
}
.card-meta {
  font-size: 12.5px;
  color: var(--muted);
  white-space: nowrap;
  padding-top: 3px;
}
.card-desc {
  font-size: 13px;
  color: var(--muted);
  margin-top: 3px;
}
.card-pe {
  border-top: 1px solid var(--line);
  padding: 6px 8px;
  display: flex;
  justify-content: flex-end;
}
.card-vazio {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 22px 18px;
  color: var(--muted);
  font-size: 14px;
}
.card-vazio .ic {
  color: var(--ok);
}
.linhas,
.lista {
  display: flex;
  flex-direction: column;
}
.lista-borda {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
}
.linha {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px 14px;
  width: 100%;
  padding: 12px 18px;
  border: 0;
  border-top: 1px solid var(--line);
  background: transparent;
  text-align: left;
}
.linhas > .linha:first-child,
.lista > .linha:first-child,
.lista > .entrega-ficha:first-child .linha {
  border-top: 0;
}
.linha.clicavel:hover {
  background: var(--surface-2);
}
.linha-txt {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.linha-nome {
  font-weight: 600;
  line-height: 1.3;
  overflow-wrap: anywhere;
}
.linha-sub {
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.linha-sub .tag {
  margin-right: 2px;
}
.linha-fim {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 5px;
  text-align: right;
}
.linha-data {
  font-size: 12.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.linha-ico {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 9px;
  background: var(--surface-2);
  color: var(--ink-2);
}
.linha-ico.codigo {
  background: transparent;
  width: auto;
}
.chips-fim {
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: flex-end;
  max-width: 360px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 3px;
}
.chip-item {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: 12.5px;
  color: var(--ink-2);
}
.chip-item b {
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.chip-item.devolvido {
  text-decoration: line-through;
  opacity: 0.65;
}
.mostrar-mais {
  border-top: 1px solid var(--line);
  padding: 8px;
  display: flex;
  justify-content: center;
}
.resumo-linha {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px 16px;
  font-size: 14px;
  color: var(--ink-2);
  align-items: center;
}
.resumo-alerta {
  color: var(--warn);
  font-weight: 600;
}

/* ---------- Painel ---------- */
.kpis {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 12px;
}
.kpi {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 5px;
  padding: 15px 16px 14px;
  min-height: 118px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  text-align: left;
  transition: border-color 0.12s, transform 0.12s;
}
.kpi:hover {
  border-color: var(--line-strong);
}
.kpi-v {
  font: 600 38px/1 var(--font-display);
  letter-spacing: -0.005em;
}
.kpi-l {
  font: 600 14px/1.25 var(--font-body);
  color: var(--ink);
}
.kpi-s {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.3;
}
.kpi.danger .kpi-v {
  color: var(--danger);
}
.kpi.warn .kpi-v {
  color: var(--warn);
}
.kpi.danger {
  border-color: var(--danger-soft);
  box-shadow: inset 0 0 0 1px var(--danger-soft);
}
.kpi.warn {
  border-color: var(--warn-soft);
  box-shadow: inset 0 0 0 1px var(--warn-soft);
}
.grade-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  align-items: start;
}
.inicio .passos {
  list-style: none;
  margin: 0;
  padding: 6px 0;
}
.passos li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
  padding: 12px 18px;
}
.passos li + li {
  border-top: 1px solid var(--line);
}
.passo-n {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1.5px solid var(--accent);
  color: var(--accent);
  font: 700 15px/1 var(--font-display);
}
.passos li.feito .passo-n {
  background: var(--ok);
  border-color: var(--ok);
  color: var(--surface);
}
.passo-txt {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.passo-txt span {
  font-size: 13.5px;
  color: var(--muted);
}
.passos li.feito .passo-txt strong {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-thickness: 1px;
}
.nota-rodape {
  font-size: 12.5px;
  color: var(--muted);
}

/* Gráfico */
.grafico-area {
  position: relative;
  padding: 10px 14px 6px 6px;
}
.grafico-area svg {
  display: block;
  max-width: 100%;
  overflow: visible;
}
.g-grade line {
  stroke: var(--line);
  stroke-width: 1;
}
.g-grade text,
.g-x {
  fill: var(--muted);
  font: 500 11.5px var(--font-body);
  font-variant-numeric: tabular-nums;
}
.g-x.atual {
  fill: var(--ink);
  font-weight: 700;
}
.g-barra {
  fill: var(--chart-bar);
  transition: fill 0.12s;
}
.g-barra.atual {
  fill: var(--accent);
}
.g-barra.hover {
  fill: var(--accent-hover);
}
.g-valor {
  fill: var(--ink);
  font: 700 12px var(--font-body);
}
.g-alvo {
  fill: transparent;
  cursor: default;
  outline: none;
}
.g-alvo:focus-visible {
  stroke: var(--accent);
  stroke-width: 2;
}
.g-tooltip {
  position: absolute;
  pointer-events: none;
  width: 150px;
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--tooltip-bg);
  color: var(--tooltip-ink);
  font-size: 12.5px;
  line-height: 1.35;
  display: flex;
  flex-direction: column;
  gap: 2px;
  box-shadow: var(--shadow-2);
}
.g-tooltip strong {
  font-size: 15px;
}
.g-key {
  display: inline-block;
  width: 12px;
  height: 2px;
  background: var(--chart-bar);
  vertical-align: middle;
  margin-right: 6px;
}
.g-det {
  opacity: 0.8;
}

/* ---------- Filtros ---------- */
.filtros {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
.filtros.compactos {
  margin-bottom: 10px;
}
.busca {
  position: relative;
  flex: 1 1 260px;
  min-width: 0;
}
.busca .ic {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
.busca .input {
  padding-left: 38px;
}
.filtros .select {
  width: auto;
  max-width: 100%;
}
.filtro-periodo {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.filtro-periodo .datas {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.filtro-periodo .datas .input {
  width: 160px;
}
.ate {
  color: var(--muted);
  font-size: 13px;
}

/* ---------- Formulários ---------- */
.input,
.select,
.textarea {
  width: 100%;
  height: 42px;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  background: var(--surface);
  color: var(--ink);
  font: 400 15px/1.2 var(--font-body);
  min-width: 0;
}
.textarea {
  height: auto;
  min-height: 84px;
  padding: 10px 12px;
  line-height: 1.45;
  resize: vertical;
}
.input:focus,
.select:focus,
.textarea:focus {
  outline: 2px solid var(--accent-soft);
  outline-offset: 0;
  border-color: var(--accent);
}
.input::placeholder,
.textarea::placeholder {
  color: var(--muted);
  opacity: 0.85;
}
.input-curto {
  width: 96px;
}
.campo {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.campo > label {
  font: 600 13.5px/1.25 var(--font-body);
  color: var(--ink-2);
}
.opcional {
  font-weight: 400;
  color: var(--muted);
}
.dica {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.4;
}
.dica.erro {
  color: var(--danger);
  font-weight: 600;
}
.bloco-dica {
  max-width: 72ch;
}
.grade-campos {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px 16px;
}
.grade-campos.tres {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.grade-campos .largo {
  grid-column: 1 / -1;
}
.input-sufixo {
  display: flex;
  align-items: center;
  gap: 8px;
}
.input-sufixo > span {
  color: var(--muted);
  font-size: 13.5px;
  white-space: nowrap;
}
.check {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 14.5px;
  line-height: 1.4;
  cursor: pointer;
}
.check input,
.participante input,
.check-nr input {
  width: 18px;
  height: 18px;
  margin: 1px 0 0;
  accent-color: var(--accent);
  flex: none;
}
.check-inline {
  align-items: center;
  font-size: 14px;
  white-space: nowrap;
}
.seg {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.seg button {
  height: 36px;
  padding: 0 13px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink-2);
  font: 600 13.5px/1 var(--font-body);
}
.seg button:hover {
  border-color: var(--muted);
}
.seg button[aria-pressed='true'] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
.seg.pequeno button {
  height: 32px;
  padding: 0 11px;
  font-size: 13px;
}
.qtd {
  display: inline-flex;
  align-items: stretch;
  height: 42px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  overflow: hidden;
  background: var(--surface);
  flex: none;
}
.qtd button {
  width: 38px;
  border: 0;
  background: var(--surface-2);
  font: 600 18px/1 var(--font-body);
  color: var(--ink-2);
}
.qtd button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.qtd input {
  width: 52px;
  border: 0;
  border-inline: 1px solid var(--line);
  text-align: center;
  font: 600 15px/1 var(--font-body);
  font-variant-numeric: tabular-nums;
  background: var(--surface);
  -moz-appearance: textfield;
}
.qtd input::-webkit-outer-spin-button,
.qtd input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
.fieldset-limpo {
  border: 0;
  margin: 0;
  padding: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* Combo */
.combo {
  position: relative;
}
.combo-input {
  position: relative;
}
.combo-input .ic {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
.combo-input .input {
  padding-left: 38px;
}
.combo-lista {
  position: absolute;
  z-index: 30;
  left: 0;
  right: 0;
  top: calc(100% + 4px);
  max-height: 290px;
  overflow-y: auto;
  margin: 0;
  padding: 5px;
  list-style: none;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-2);
}
.combo-lista li {
  padding: 8px 10px;
  border-radius: 7px;
  cursor: pointer;
}
.combo-lista li.ativo {
  background: var(--accent-soft);
}
.combo-vazio {
  color: var(--muted);
  cursor: default !important;
}
.opcao {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.opcao-nome {
  font-weight: 600;
}
.opcao-sub {
  font-size: 12.5px;
  color: var(--muted);
}

/* ---------- Abas e contadores ---------- */
.abas {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  scrollbar-width: none;
}
.abas::-webkit-scrollbar {
  display: none;
}
.aba {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 42px;
  padding: 0 12px;
  border: 0;
  border-bottom: 2.5px solid transparent;
  background: none;
  color: var(--muted);
  font: 600 14.5px/1 var(--font-body);
  white-space: nowrap;
  margin-bottom: -1px;
}
.aba:hover {
  color: var(--ink);
}
.aba[aria-selected='true'] {
  color: var(--ink);
  border-bottom-color: var(--accent);
}
.aba-cont {
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--warn-soft);
  color: var(--warn);
  font: 700 11.5px/20px var(--font-body);
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.aba-cont.danger {
  background: var(--danger-soft);
  color: var(--danger);
}
.aba-cont.plain {
  background: var(--surface-3);
  color: var(--ink-2);
}
.contadores {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}
.contador {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 12px 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface);
  text-align: left;
}
.contador b {
  font: 600 30px/1 var(--font-display);
  font-variant-numeric: tabular-nums;
}
.contador span {
  font-size: 13.5px;
  color: var(--ink-2);
  font-weight: 600;
  line-height: 1.2;
}
.contador.danger b {
  color: var(--danger);
}
.contador.warn b {
  color: var(--warn);
}
.contador.danger-outline b {
  color: var(--danger);
}
.contador.ok b {
  color: var(--ok);
}
.contador.zero b,
.contador.ok.zero b {
  color: var(--muted);
}
.grupos {
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.grupo {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.grupo-titulo {
  font: 600 20px/1.2 var(--font-display);
}
.validade {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
  white-space: nowrap;
}

/* ---------- Matriz de NR ---------- */
.legenda {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  font-size: 12.5px;
  color: var(--ink-2);
}
.legenda span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.leg {
  width: 14px;
  height: 14px;
  border-radius: 4px;
  display: inline-block;
}
.leg.ok {
  background: var(--ok-soft);
  box-shadow: inset 0 0 0 1px var(--ok);
}
.leg.warn {
  background: var(--warn-soft);
  box-shadow: inset 0 0 0 1px var(--warn-strong);
}
.leg.danger {
  background: var(--danger-soft);
  box-shadow: inset 0 0 0 1px var(--danger);
}
.leg.pend {
  background: transparent;
  box-shadow: inset 0 0 0 1.5px var(--danger);
  border-radius: 4px;
}
.leg.na {
  background: var(--surface-3);
}
.matriz-wrap {
  overflow: auto;
  max-height: 72vh;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
}
.matriz {
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
  min-width: 100%;
}
.matriz th,
.matriz td {
  border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line);
  padding: 0;
  vertical-align: middle;
}
.matriz thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--surface-2);
  text-align: left;
}
.matriz .emp {
  position: sticky;
  left: 0;
  z-index: 1;
  background: var(--surface);
  min-width: 200px;
  max-width: 250px;
  text-align: left;
  font-weight: 400;
}
.matriz thead .emp {
  z-index: 3;
  background: var(--surface-2);
  padding: 10px 12px;
  font: 600 12.5px/1 var(--font-display);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  vertical-align: bottom;
}
.matriz tbody .emp .link-bloco {
  width: 100%;
  padding: 7px 12px;
}
.emp-nome {
  font-weight: 600;
  font-size: 13.5px;
  line-height: 1.25;
}
.emp-sub {
  font-size: 12px;
  color: var(--muted);
}
.col-nr {
  min-width: 104px;
  max-width: 130px;
  padding: 9px 10px !important;
  vertical-align: bottom !important;
}
.col-cod {
  display: block;
  font: 600 12.5px/1.2 var(--font-mono);
  color: var(--ink);
}
.col-nome {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-2);
  line-height: 1.25;
  margin-top: 3px;
}
.col-val {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
  font-weight: 500;
}
.celula {
  display: grid;
  place-items: center;
  width: 100%;
  min-height: 46px;
  padding: 4px 6px;
  border: 0;
  background: transparent;
  font: 500 12.5px/1.1 var(--font-mono);
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.celula.ok {
  background: var(--ok-soft);
  color: var(--ok);
}
.celula.warn {
  background: var(--warn-soft);
  color: var(--warn);
  font-weight: 600;
}
.celula.danger {
  background: var(--danger-soft);
  color: var(--danger);
  font-weight: 600;
}
.celula.pend {
  box-shadow: inset 0 0 0 1.5px var(--danger);
  color: var(--danger);
  font: 600 12px/1 var(--font-body);
}
.celula.na {
  color: var(--line-strong);
}
.celula:hover {
  filter: brightness(0.97);
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}

/* ---------- Tabelas ---------- */
.tabela-wrap {
  overflow-x: auto;
  max-width: 100%;
}
.tabela-wrap.altura-limitada {
  max-height: 320px;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
}
.tabela {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.tabela th {
  text-align: left;
  font: 600 12px/1.2 var(--font-display);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
  white-space: nowrap;
  position: sticky;
  top: 0;
}
.tabela td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.tabela tfoot td {
  border-bottom: 0;
  font-weight: 600;
  background: var(--surface-2);
}
.tabela .num,
.num-data {
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.num-data {
  text-align: left;
}
.tabela td .btn {
  margin-left: 6px;
}
.celula-nome {
  display: block;
  font-weight: 600;
}
.celula-sub {
  display: block;
  font-size: 12.5px;
  color: var(--muted);
}

/* ---------- Modais ---------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: var(--overlay);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: max(28px, env(safe-area-inset-top, 0px)) 16px max(28px, env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  overscroll-behavior: contain;
}
.dialog {
  width: 100%;
  max-width: 700px;
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-2);
  display: flex;
  flex-direction: column;
  outline: none;
  margin-block: auto;
}
.dialog.lg {
  max-width: 980px;
}
.dialog.sm {
  max-width: 470px;
}
.dialog-head {
  position: sticky;
  top: calc(-1 * max(28px, env(safe-area-inset-top, 0px)));
  z-index: 5;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 20px 14px 22px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
}
.dialog-titulos {
  min-width: 0;
}
.dialog-head h2 {
  font: 700 25px/1.1 var(--font-display);
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.dialog-sub {
  margin-top: 4px;
  font-size: 13.5px;
  color: var(--muted);
}
.dialog-body {
  padding: 20px 22px 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 0;
}
.dialog-foot {
  position: sticky;
  bottom: calc(-1 * max(28px, env(safe-area-inset-bottom, 0px)));
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  padding: 14px 22px;
  background: var(--surface);
  border-top: 1px solid var(--line);
  border-radius: 0 0 var(--r-lg) var(--r-lg);
}
.rodape-erro {
  color: var(--danger);
  font-weight: 600;
  font-size: 13.5px;
  margin-right: auto;
}
.progresso {
  margin-right: auto;
  color: var(--ink-2);
  font-size: 13.5px;
  font-variant-numeric: tabular-nums;
}
.bloco {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}
.bloco-titulo {
  font: 600 13px/1.2 var(--font-display);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.dados-grade {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 12px 18px;
  margin: 0;
  padding: 14px 16px;
  background: var(--surface-2);
  border-radius: var(--r-md);
}
.dados-grade dt {
  font: 600 11.5px/1.2 var(--font-display);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.dados-grade dd {
  margin: 4px 0 0;
  font-size: 14.5px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

/* Nova entrega */
.func-escolhido {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface-2);
}
.func-escolhido .linha-txt {
  flex: 1;
}
.tamanhos-mini {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  font-size: 12.5px;
  color: var(--muted);
}
.tamanhos-mini b {
  color: var(--ink);
}
.sugestoes {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.sugestoes-rotulo {
  font-size: 13px;
  color: var(--muted);
  font-weight: 600;
}
.chip-sugestao {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 30px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px dashed var(--accent);
  background: var(--surface);
  color: var(--accent);
  font: 600 13px/1 var(--font-body);
}
.chip-sugestao.atrasada {
  border-color: var(--danger);
  color: var(--danger);
}
.chip-sugestao .mudo {
  font-weight: 500;
}
.linhas-entrega {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.item-form {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px 12px 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--surface);
}
.item-form.com-erro {
  border-color: var(--danger);
}
.item-form-topo {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
}
.item-form-nome {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.item-form-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.item-form-campos {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 12px;
  align-items: center;
}
.item-form-campos .select {
  width: 190px;
  max-width: 100%;
}
.tam-unico {
  font-size: 13.5px;
  color: var(--muted);
  min-width: 120px;
}
.saldo {
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.saldo.falta {
  color: var(--warn);
  font-weight: 600;
}
.item-form-hist {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  color: var(--muted);
}
.adicionar-itens {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.adicionar-combo {
  flex: 1 1 320px;
  min-width: 0;
}
.select-kit {
  flex: 0 1 230px;
}
.termo-bloco {
  padding: 16px;
  border-radius: var(--r-md);
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.termo-texto {
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--ink-2);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  max-width: 80ch;
}
.termo-texto.aberto {
  display: block;
  -webkit-line-clamp: unset;
}
.termo-bloco > .btn-ghost {
  align-self: flex-start;
  margin-top: -6px;
}

/* Assinatura */
.assinatura {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sigpad {
  position: relative;
  background: var(--paper);
  border: 1.5px dashed var(--paper-line);
  border-radius: var(--r-md);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.sigpad canvas {
  display: block;
  position: relative;
  z-index: 2;
  touch-action: none;
  cursor: crosshair;
}
.sig-linha {
  position: absolute;
  left: 28px;
  right: 28px;
  bottom: 42px;
  border-bottom: 1px solid var(--paper-line);
  z-index: 1;
}
.sig-x {
  position: absolute;
  left: 30px;
  bottom: 48px;
  z-index: 1;
  color: var(--paper-hint);
  font: 600 16px/1 var(--font-body);
}
.sig-dica {
  position: absolute;
  inset: auto 0 14px;
  text-align: center;
  z-index: 1;
  font-size: 13px;
  color: var(--paper-hint);
  pointer-events: none;
}
.sig-rodape {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.sig-img {
  display: inline-block;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 4px 8px;
  line-height: 0;
}
.sig-img img {
  height: 54px;
  width: auto;
  max-width: 100%;
}
.sig-img.grande img {
  height: 110px;
}
.itens-detalhe {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
}
.item-det {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 11px 14px;
}
.item-det + .item-det {
  border-top: 1px solid var(--line);
}
.item-det-q {
  font: 700 20px/1 var(--font-display);
  min-width: 34px;
  font-variant-numeric: tabular-nums;
}
.devolucao-info {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  color: var(--warn);
  font-weight: 600;
}

/* Funcionário */
.func-topo {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.func-info {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
  font-size: 13.5px;
  color: var(--ink-2);
}
.func-dado b {
  color: var(--ink);
}
.func-acoes {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.func-obs {
  font-size: 13.5px;
  color: var(--ink-2);
  padding: 10px 12px;
  background: var(--surface-2);
  border-radius: var(--r-sm);
}
.entrega-ficha + .entrega-ficha {
  border-top: 1px solid var(--line);
}
.entrega-ficha .linha {
  border-top: 0;
}
.entrega-ficha-ass {
  padding: 0 18px 12px 84px;
}
.zona-acoes {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.grade-tamanhos {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
.checks-nr {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px 14px;
}
.check-nr {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
  padding: 6px 0;
  cursor: pointer;
  min-width: 0;
}
.check-nr > span:not(.tag) {
  min-width: 0;
}
.check-nr.fixo {
  cursor: default;
}
.checks-lista {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 280px;
  overflow-y: auto;
  padding: 2px;
}

/* Estoque */
.linha-item {
  grid-template-columns: minmax(0, 1fr) auto;
}
.item-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 8px;
  align-items: center;
  margin-top: 2px;
}
.grade-saldo {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 6px;
  margin-top: 5px;
}
.grade-saldo span {
  font-size: 12px;
  color: var(--ink-2);
  padding: 2px 7px;
  border-radius: 5px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.grade-saldo span.zero {
  color: var(--danger);
  background: var(--danger-soft);
  border-color: transparent;
}
.saldo-fim {
  align-items: flex-end;
}
.saldo-num {
  font: 600 30px/1 var(--font-display);
  font-variant-numeric: tabular-nums;
}
.saldo-num.pequeno {
  font-size: 22px;
}
.saldo-num.neg {
  color: var(--danger);
}
.saldo-num.sem-controle {
  color: var(--muted);
}
.dialog-body .aviso {
  margin: 0;
}
.troca-linha {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  align-items: center;
}
.troca-outro {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.grade-qtds {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 10px;
}
.qtd-tam {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.qtd-tam label {
  font: 700 15px/1 var(--font-display);
}
.qtd-tam-info {
  font-size: 12px;
  color: var(--muted);
}
.qtd-tam-info .neg {
  color: var(--danger);
}
.qtd-tam-info .pos {
  color: var(--ok);
}
.kit-linha {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  gap: 10px;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--line);
}

/* NR forms */
.venc-auto {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  min-height: 42px;
  font-size: 14px;
}
.chips-funcoes {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip-remover {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 30px;
  padding: 0 4px 0 11px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font: 600 13px/1 var(--font-body);
}
.chip-remover button {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 0;
  background: transparent;
  color: inherit;
}
.chip-remover button:hover {
  background: var(--surface);
}
.add-funcao {
  display: flex;
  gap: 8px;
}
.participantes {
  display: flex;
  flex-direction: column;
  max-height: 340px;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
}
.participante {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 9px 12px;
  cursor: pointer;
}
.participante + .participante {
  border-top: 1px solid var(--line);
}
.participante:hover {
  background: var(--surface-2);
}

/* Relatórios e configurações */
.numeros {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.numeros > div {
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.numeros b {
  font: 600 30px/1 var(--font-display);
  font-variant-numeric: tabular-nums;
}
.numeros span {
  font-size: 13px;
  color: var(--muted);
  font-weight: 600;
}
.secao {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.secao-titulo {
  font: 600 22px/1.15 var(--font-display);
}
.secao-sub {
  color: var(--muted);
  font-size: 13.5px;
}
.exportacoes {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.exportacao {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
}
.exportacao h3 {
  font: 600 15px/1.25 var(--font-body);
}
.exportacao p {
  font-size: 13px;
  color: var(--muted);
  margin-top: 2px;
}
.lista-simples {
  list-style: none;
  margin: 0;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
}
.lista-simples li {
  display: flex;
  justify-content: space-between;
  padding: 9px 14px;
  font-variant-numeric: tabular-nums;
}
.lista-simples li + li {
  border-top: 1px solid var(--line);
}
.lista-pontos {
  margin: 0;
  padding-left: 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  color: var(--ink-2);
  max-width: 76ch;
}

/* ---------- Avisos, vazio, toasts ---------- */
.aviso {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  padding: 11px 14px;
  margin-bottom: 18px;
  border-radius: var(--r-md);
  border: 1px solid var(--warn-strong);
  background: var(--warn-soft);
  color: var(--ink);
  font-size: 14px;
}
.aviso > span {
  flex: 1 1 260px;
}
.aviso .ic {
  color: var(--warn);
}
.aviso.demo {
  background: repeating-linear-gradient(-45deg, var(--warn-soft) 0 16px, var(--surface) 16px 32px);
}
.aviso.leve {
  border-color: var(--line);
  background: var(--surface);
}
.aviso.leve .ic {
  color: var(--accent);
}
.vazio-bloco {
  padding: 30px 22px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
}
.vazio-icone {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border-radius: 12px;
  background: var(--accent-soft);
  color: var(--accent);
}
.vazio-bloco h3 {
  font: 600 21px/1.2 var(--font-display);
}
.vazio-bloco p {
  color: var(--muted);
  max-width: 60ch;
}
.vazio-bloco .acoes {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 4px;
}
.toasts {
  position: fixed;
  z-index: 90;
  left: 50%;
  transform: translateX(-50%);
  top: calc(16px + env(safe-area-inset-top, 0px));
  width: min(480px, calc(100% - 32px));
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--r-md);
  background: var(--tooltip-bg);
  color: var(--tooltip-ink);
  box-shadow: var(--shadow-2);
  font-size: 14px;
  animation: entra 0.18s ease-out;
}
.toast .ic {
  color: var(--ok);
}
.toast.erro .ic {
  color: var(--danger);
}
.toast > span {
  flex: 1;
}
.toast-acao {
  border: 0;
  background: transparent;
  color: inherit;
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 3px;
  white-space: nowrap;
}
@keyframes entra {
  from {
    transform: translateY(8px);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
.erro-tela {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.erro-tela h2 {
  font: 600 22px/1.2 var(--font-display);
}

/* Carregamento */
.esq {
  background: var(--surface);
  border: 1px solid var(--line);
  animation: pulso 1.4s ease-in-out infinite;
}
.esq-titulo {
  height: 40px;
  width: 280px;
  max-width: 70%;
  border-radius: 8px;
}
.esq-card {
  height: 220px;
}
.carregando-txt {
  color: var(--muted);
  font-size: 14px;
}
@keyframes pulso {
  50% {
    opacity: 0.55;
  }
}

/* Menu e barra inferior (celular) */
.menu-mais {
  position: relative;
  margin-left: auto;
}
.menu-lista {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  z-index: 50;
  min-width: 230px;
  padding: 6px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-2);
  display: flex;
  flex-direction: column;
}
.menu-lista button {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 42px;
  padding: 0 10px;
  border: 0;
  border-radius: 8px;
  background: none;
  text-align: left;
  font-weight: 600;
  font-size: 14.5px;
}
.menu-lista button:hover {
  background: var(--surface-2);
}
.bottomnav {
  display: none;
}
.fab {
  display: none;
}

/* ---------- Responsivo ---------- */
@media (min-width: 861px) {
  .app {
    background: linear-gradient(90deg, var(--surface) 0 calc(var(--sidebar-w) - 1px), var(--line) calc(var(--sidebar-w) - 1px) var(--sidebar-w), var(--bg) var(--sidebar-w));
  }
}
@media (max-width: 1180px) {
  .kpis {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
@media (max-width: 980px) {
  .grade-2 {
    grid-template-columns: minmax(0, 1fr);
  }
  .exportacoes {
    grid-template-columns: minmax(0, 1fr);
  }
}
@media (max-width: 860px) {
  .app {
    grid-template-columns: minmax(0, 1fr);
  }
  .sidebar {
    display: none;
  }
  .topo-mobile {
    position: sticky;

    display: flex;

    display: flex;

  .topo-view {
    font-size: 12.5px;
    color: var(--muted);

    padding-block: 18px calc(150px + env(safe-area-inset-bottom, 0px));
  }
  .bottomnav {

    z-index: 40;

  }

    top: -6px;
    left: 14px;
    min-width: 18px;
    height: 17px;
    font-size: 10.5px;
    line-height: 17px;
    padding: 0 5px;
  }
  .fab {
    position: fixed;
    right: 16px;
    bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    z-index: 41;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 52px;
    padding: 0 18px 0 14px;
    border-radius: 999px;
    border: 0;
    background: var(--accent);
    color: var(--accent-ink);
    font: 700 15px/1 var(--font-body);
    box-shadow: var(--shadow-2);
  }
  .toasts {
    top: auto;
    bottom: calc(140px + env(safe-area-inset-bottom, 0px));
  }
  .titulo {
    font-size: 29px;
  }
  .contadores {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 640px) {
  .kpis {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .kpi {
    min-height: 108px;
    padding: 13px 13px 12px;
  }
  .kpi-v {
    font-size: 32px;
  }
  .linha {
    grid-template-columns: auto minmax(0, 1fr);
    padding: 12px 14px;
  }
  .linha > .linha-fim {
    grid-column: 2;
    align-items: flex-start;
    flex-direction: row;
    flex-wrap: wrap;
    text-align: left;
  }
  .linha-item {
    grid-template-columns: minmax(0, 1fr);
  }
  .linha-item > .linha-fim {
    grid-column: 1;
    align-items: center;
  }
  .chips-fim {
    justify-content: flex-start;
  }
  .grade-campos,
  .grade-campos.tres {
    grid-template-columns: minmax(0, 1fr);
  }
  .grade-tamanhos {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .checks-nr {
    grid-template-columns: minmax(0, 1fr);
  }
  .numeros {
    grid-template-columns: minmax(0, 1fr);
  }
  .numeros > div {
    flex-direction: row;
    align-items: baseline;
    gap: 10px;
  }
  .overlay {
    padding: 0;
  }
  .dialog,
  .dialog.lg,
  .dialog.sm {
    max-width: none;
    min-height: 100%;
    border-radius: 0;
    margin: 0;
  }
  .dialog-head {
    top: 0;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 12px 12px 16px;
    border-radius: 0;
  }
  .dialog-head h2 {
    font-size: 22px;
  }
  .dialog-body {
    padding: 16px 16px 24px;
    flex: 1;
  }
  .dialog-foot {
    bottom: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    border-radius: 0;
  }
  .dialog-foot .btn {
    flex: 1 1 auto;
  }
  .dialog-foot .espaco {
    display: none;
  }
  .passos li {
    grid-template-columns: auto minmax(0, 1fr);
  }
  .passo-acao {
    grid-column: 2;
  }
  .entrega-ficha-ass {
    padding-left: 80px;
  }
  .item-det {
    grid-template-columns: auto minmax(0, 1fr);
  }
  .item-det > .btn {
    grid-column: 2;
    justify-self: start;
  }
  .filtros .select,
  .filtro-periodo,
  .filtro-periodo .select {
    flex: 1 1 150px;
  }
  .pagehead-acoes {
    width: 100%;
  }
  .pagehead-acoes .btn {
    flex: 1 1 auto;
  }
  .titulo {
    font-size: 27px;
  }
  .func-acoes .btn {
    flex: 1 1 auto;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
