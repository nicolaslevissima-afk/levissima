<style>
  :root { --ink: #1C2A2E; --paper: #F6F7F4; --card: #FFFFFF; --line: #D6D5DE; --muted: #545869; --verde: #43B02A; --verde-texto: #2D7A1C; --roxo: #702082; --danger: #B3261E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 -apple-system, "Segoe UI", Inter, Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  main { max-width: 640px; margin: 0 auto; padding: 18px 16px 48px; }
  .topo { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .topo svg { height: 40px; width: auto; }
  .lv-s1, .lv-s2, .lv-s3, .lv-s4 { fill: #1E3A8A; } .lv-p { fill: #64B04A; }
  .faixa { height: 4px; background: linear-gradient(90deg, #43B02A 0 25%, #702082 25% 50%, #001489 50% 75%, #FF6A13 75%); }
  h1 { font-size: 1.375rem; margin: 6px 0 2px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  h2 { font-size: 0.8125rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .card.destaque { border: 2px solid var(--roxo); }
  .dias { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .dia { flex: 0 0 auto; min-width: 104px; scroll-snap-align: start; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; font: inherit; color: var(--ink); cursor: pointer; }
  .dia b { display: block; font-size: 0.9375rem; }
  .dia small { color: var(--verde-texto); font-weight: 600; font-size: 0.75rem; }
  .dia.sem small { color: var(--muted); font-weight: 400; }
  .dia.sem { opacity: 0.6; }
  .dia.on { border: 2px solid var(--verde); background: #EFF8EC; }
  .horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .hora { min-height: 52px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; font: inherit; font-size: 1.0625rem; font-weight: 700; color: var(--ink); cursor: pointer; }
  .hora.on { background: var(--verde); border-color: var(--verde); color: #10200C; }
  .vazio { color: var(--muted); text-align: center; padding: 18px 8px; }
  .btn { display: block; width: 100%; min-height: 50px; border: 0; border-radius: 12px; background: var(--roxo); color: #fff; font: inherit; font-size: 1.0625rem; font-weight: 700; cursor: pointer; }
  .btn:disabled { opacity: 0.6; }
  .btn.sec { background: transparent; color: var(--danger); border: 1px solid var(--line); margin-top: 8px; font-weight: 600; }
  .linha { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .chip { font-size: 0.75rem; font-weight: 700; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .chip.ok { background: #E3F4DE; color: var(--verde-texto); } .chip.ag { background: #F1E5F5; color: var(--roxo); }
  .link { background: none; border: 0; color: var(--danger); font: inherit; font-size: 0.875rem; cursor: pointer; padding: 6px 0 0; }
  .link.conf { color: var(--verde-texto); font-weight: 700; margin-right: 14px; }
  label { display: block; font-size: 0.875rem; color: var(--muted); margin: 10px 0; }
  input[type=text] { display: block; width: 100%; margin-top: 4px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
  .msg { border-radius: 12px; padding: 12px 14px; margin: 10px 0; font-weight: 600; }
  .msg.ok { background: #E3F4DE; color: var(--verde-texto); } .msg.erro { background: #FBE9E7; color: var(--danger); }
  footer { color: var(--muted); font-size: 0.8125rem; margin-top: 30px; text-align: center; }
  footer a { color: var(--muted); }
</style>

<script>
(function () {
  'use strict';
  var SB_URL = "https://lzsvtwwpthjncrhznfez.supabase.co";
  var SB_CHAVE = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6c3Z0d3dwdGhqbmNyaHpuZmV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NTQ5MjgsImV4cCI6MjEwNzMzMDkyOH0.W446lxCtvIVPn45yQqgr8Gj77s_n-t5E1Q-YYeWFN2E";
  var FN = SB_URL + '/functions/v1/agendamento';
  var est = { t: '', d: null, dia: null, hora: null, conf: '', msg: null, ocupado: false };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function hash() { var o = {}; location.hash.replace(/^#/, '').split('&').forEach(function (x) { var kv = x.split('='); if (kv[0]) o[kv[0]] = decodeURIComponent(kv[1] || ''); }); return o; }
  function chamar(corpo) {
    return fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_CHAVE, Authorization: 'Bearer ' + SB_CHAVE }, body: JSON.stringify(Object.assign({ t: est.t }, corpo)) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok || j.erro) { var e = new Error(j.erro || 'erro'); e.codigo = j.erro || 'rede'; e.max = j.max; throw e; } return j; }); });
  }
  function carregar() {
    return chamar({ acao: 'horarios' }).then(function (d) {
      est.d = d;
      if (!est.dia || !d.dias.some(function (x) { return x.data === est.dia; })) { var p = d.dias.filter(function (x) { return x.horas.length; })[0]; est.dia = p ? p.data : (d.dias[0] && d.dias[0].data); }
      var dd = d.dias.find(function (x) { return x.data === est.dia; });
      if (est.hora && (!dd || dd.horas.indexOf(est.hora) < 0)) est.hora = null;
      render();
    }).catch(function (e) {
      document.getElementById('app').innerHTML = e.codigo === 'link'
        ? '<h1>Link inválido</h1><p class="sub">Este link de agendamento não vale mais. Peça um novo link à Levíssima.</p>'
        : '<h1>Sem conexão</h1><p class="sub">Não foi possível abrir a agenda agora. Confira a internet e tente de novo.</p><button class="btn" id="tentar">Tentar de novo</button>';
      var b = document.getElementById('tentar'); if (b) b.onclick = carregar;
    });
  }
  function render() {
    var d = est.d, h = '';
    var primeiro = String(d.cliente.nome || '').split(' ')[0];
    h += '<h1>Olá, ' + esc(primeiro) + '!</h1><p class="sub">Escolha o dia e o horário para buscar os seus garrafões. Você só vê os horários livres.</p>';
    if (est.msg) h += '<div class="msg ' + est.msg.tipo + '">' + esc(est.msg.txt) + '</div>';
    var conf = est.conf ? d.meus.find(function (m) { return m.id === est.conf; }) : null;
    if (conf) {
      h += '<div class="card destaque"><b>Confirme o seu agendamento</b><p style="margin:6px 0 12px">' + esc(conf.rotulo) + ' às <b>' + esc(conf.hora) + '</b>' + (conf.status === 'confirmado' ? ' · <span class="chip ok">confirmado</span>' : '') + '</p>' +
        (conf.status === 'confirmado' ? '' : '<button class="btn" data-a="confirmar" data-id="' + esc(conf.id) + '">Confirmo, vou buscar</button>') +
        '<button class="btn sec" data-a="cancelar" data-id="' + esc(conf.id) + '">Não vou, cancelar</button></div>';
    }
    if (d.meus.length) {
      h += '<h2>Seus agendamentos</h2>' + d.meus.map(function (m) {
        return '<div class="card"><div class="linha"><span><b>' + esc(m.rotulo) + '</b> às <b>' + esc(m.hora) + '</b></span><span class="chip ' + (m.status === 'confirmado' ? 'ok' : 'ag') + '">' + (m.status === 'confirmado' ? 'confirmado' : 'agendado') + '</span></div>' +
          (m.status !== 'confirmado' ? '<button class="link conf" data-a="confirmar" data-id="' + esc(m.id) + '">Confirmar</button>' : '') + '<button class="link" data-a="cancelar" data-id="' + esc(m.id) + '">Cancelar</button></div>';
      }).join('');
    }
    if (!d.ativo) { h += '<div class="card"><p class="vazio">O agendamento on-line está fechado no momento. Fale com a Levíssima.</p></div>'; document.getElementById('app').innerHTML = h; ligar(); return; }
    h += '<h2>Escolha o dia</h2><div class="dias">' + d.dias.map(function (x) {
      var n = x.horas.length, partes = x.rotulo.split(', ');
      return '<button class="dia' + (n ? '' : ' sem') + (x.data === est.dia ? ' on' : '') + '" data-a="dia" data-d="' + x.data + '"><b>' + esc(partes[0]) + '</b>' + esc(partes[1] || '') + '<br><small>' + (n ? n + (n === 1 ? ' horário' : ' horários') : esc(x.motivo === 'Sem horário livre.' ? 'lotado' : 'fechado')) + '</small></button>';
    }).join('') + '</div>';
    var dia = d.dias.find(function (x) { return x.data === est.dia; });
    if (dia) {
      h += '<h2>Horários livres · ' + esc(dia.rotulo) + '</h2>';
      h += dia.horas.length ? '<div class="horas">' + dia.horas.map(function (x) { return '<button class="hora' + (x === est.hora ? ' on' : '') + '" data-a="hora" data-h="' + x + '">' + x + '</button>'; }).join('') + '</div>'
        : '<div class="card"><p class="vazio">' + esc(dia.motivo || 'Sem horário livre.') + ' Escolha outro dia.</p></div>';
    }
    if (est.hora && dia) {
      h += '<div class="card destaque" style="margin-top:14px"><b>' + esc(dia.rotulo) + ' às ' + esc(est.hora) + '</b>' +
        '<label>Observação <span>(opcional, ex.: quantos garrafões)</span><input type="text" id="obs" maxlength="140" autocomplete="off" /></label>' +
        '<button class="btn" data-a="agendar"' + (est.ocupado ? ' disabled' : '') + '>Confirmar agendamento</button></div>';
    }
    document.getElementById('app').innerHTML = h;
    ligar();
  }
  function ligar() {
    document.querySelectorAll('#app [data-a]').forEach(function (b) { b.onclick = function () { acao(b); }; });
  }
  function acao(b) {
    var a = b.getAttribute('data-a');
    if (a === 'dia') { est.dia = b.getAttribute('data-d'); est.hora = null; est.msg = null; render(); return; }
    if (a === 'hora') { est.hora = b.getAttribute('data-h'); est.msg = null; render(); setTimeout(function () { var c = document.querySelector('.card.destaque:last-of-type'); if (c && c.scrollIntoView) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 30); return; }

      return;
    }
    if (a === 'confirmar' || a === 'cancelar') {

      b.disabled = true;
      chamar({ acao: a, id: b.getAttribute('data-id') }).then(function () {
        est.msg = { tipo: 'ok', txt: a === 'confirmar' ? 'Obrigado! Agendamento confirmado.' : 'Agendamento cancelado. O horário ficou livre para outro cliente.' };
        if (a === 'cancelar' && est.conf === b.getAttribute('data-id')) est.conf = '';
        window.scrollTo(0, 0); return carregar();
      }).catch(function () { est.msg = { tipo: 'erro', txt: 'Não foi possível agora. Tente de novo.' }; render(); });
    }
  }
  var p = hash();
  est.t = p.t || '';
  est.conf = p.c || '';
  if (!est.t) { document.getElementById('app').innerHTML = '<h1>Link incompleto</h1><p class="sub">Abra o link que a Levíssima mandou para você.</p>'; return; }
  carregar();
})();
</script>
</body>
</html>
